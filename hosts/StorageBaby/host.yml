domain: home.klees.io
acme: true
acme_email: email@janlucaklees.de
# The domains this host can obtain a certificate for -- one wildcard request each. All
# three are in the same Porkbun account, so the one resolver traefik declares covers them;
# the A records are the operator's. A service takes a name under one of these by writing it
# out in full in its own `service.yml`.
#
# `mayu.klees.io` is here because `*.klees.io` is one label deep and `chat.mayu.klees.io`
# is two, so the second wildcard does not cover librechat's name -- and nothing would say
# so: the route would be served traefik's own default certificate and only the browser
# would complain. DNS needed nothing for it, which is the trap: Porkbun answers the
# existing `*.klees.io` record at any depth, so her name resolved to this host before it
# could be served.
cert_zones: [home.klees.io, klees.io, mayu.klees.io]
# The registries this host holds a login for (secrets/registries.sops.yaml). A service
# names the ones it needs; one it names that is not here is refused at converge.
registries: [ghcr.io]
tz: Europe/Berlin
storage_roots:
  pool: /pool/apps
  fast: /var/lib/storagebaby/fast
# The filesystems this host is made of. The `storage` role mounts exactly these and
# refuses to converge when one of them is missing -- which is what `mountpoints` used
# to do by hand. It never partitions, formats or wipes: a new disk is prepared once by
# hand (the role README, "Adding a disk") and then declared here.
#
# The partuuids and the parity `by-id` path are the ones the hand-stowed units this phase
# retired carried, and the names are what the deployed `snapraid.conf` already calls the
# disks -- renaming one would make snapraid treat that disk as new. Verify all four device
# paths against the running host before the first converge (root README, operator steps).
storage:
  disks:
    - {
        name: d1,
        device: /dev/disk/by-partuuid/a36d7f0a-aa65-4214-98e0-f3818954a494,
        mount: /mnt/data/data1,
        fstype: ext4
      }
    - {
        name: d2,
        device: /dev/disk/by-partuuid/243e4d8c-d018-4b9a-af9d-dcd3626138d4,
        mount: /mnt/data/data2,
        fstype: ext4
      }
    - {
        name: d3,
        device: /dev/disk/by-partuuid/d3b1a8bb-3da9-48dc-a082-2603cf186444,
        mount: /mnt/data/data3,
        fstype: ext4
      }
  parity:
    - {
        name: parity1,
        device: /dev/disk/by-id/ata-WDC_WD40EFRX-68N32N0_WD-WCC7K2EYYVV1-part1,
        mount: /mnt/parity/parity1,
        fstype: ext4
      }
  pool:
    mount: /pool
    options: defaults,allow_other,use_ino,category.create=pfrd,moveonenospc=true,minfreespace=20G,fsname=mergerfsPool,cache.writeback=false,cache.symlinks=false,cache.readdir=false,async_read=true,threads=4
  snapraid:
    block_size: 256
    # Paths are relative to a *disk's* root, which for a branch of this pool is the
    # same as relative to /pool.
    #
    # `/apps/` is excluded: snapraid cannot parity a file that is rewritten while it
    # reads it, which is what made the nightly run end in `exit:warning` on four soft
    # errors, every one of them a SQLite or appdata file under a running service. What
    # protects that tree instead is the kopia repository at
    # /pool/backups/devices/StorageBaby/kopia -- it sits outside /apps, so it stays in
    # the array, and it must stay out of every anchored exclude here.
    #
    # The design is 2026-10-14, section 3.1; this is its stage 2, carried out 2026-10-15
    # once `kopia snapshot list --all` showed immich@storagebaby:/data/upload complete.
    # What it costs: a dead disk now means restoring application state from last night's
    # snapshot rather than repairing it in place, and whatever under /apps has no
    # `backup:` block -- jellyfin's metadata above all -- is protected by nothing at all
    # (Cradle's docs/ownership.md section 7, item 14). Reverting is one line and one converge: the
    # next sync re-parities /apps, long once.
    excludes:
      - '*.bak'
      - '*.unrecoverable'
      - /tmp/
      - /lost+found/
      - /apps/
      - .AppleDouble
      - ._AppleDouble
      - .DS_Store
      - .Thumbs.db
      - .fseventsd
      - .Spotlight-V100
      - .TemporaryItems
      - .Trashes
      - .AppleDB
      - '*.tmp'
      - '*.log'
      - /cache/
      # SQLite's write-ahead log and shared-memory files: rewritten constantly, worthless
      # in parity, and the database file beside them is what a restore needs.
      - '*.db-shm'
      - '*.db-wal'
    maintenance:
      on_calendar: '02:00'
      scrub_percent: 8
      scrub_older_days: 12
      # Services stopped across the parity window -- before the sync, started again
      # after the scrub, and on failure so a run that aborts never leaves one down.
      # Every name has to be a service placed on this host.
      #
      # Empty, and that is being tried out rather than settled. It held `jellyfin`
      # for two reasons that are both gone: the nightly balance moved its config tree
      # between branches under the running container, and the sync parityed that tree
      # while it was being written. There is no balance step any more, and /apps is out
      # of the array -- so nothing the run reads belongs to jellyfin, and stopping the
      # media server every night at 02:00 buys nothing.
      #
      # What is left is the one tree jellyfin can still write that the run does read:
      # /pool/shared/media, which it has `rw` (artwork, NFO and trickplay files written
      # beside the library). If that turns out to matter, the symptom is a new soft
      # error under /shared/media in the nightly mail -- and the fix is to put jellyfin
      # back in this list, not to mount the library read-only, which would also stop
      # the operator's own writes to it.
      stop_services: []
  # Where the maintenance report goes. `smtp_host` and `smtp_user` are operator items: the
  # deployed wrapper used whatever MTA the host happened to have, which this repository
  # never captured, so the relay has to be filled in before the first converge --
  # otherwise the mail step fails nightly while the run itself succeeds. The password is
  # hosts/StorageBaby/secrets/mail.sops.yaml, key `smtp_password`.
  mail:
    to: email@janlucaklees.de
    # The login, as the relay insists the sender be. 465 is implicit TLS on this relay
    # (the old ~/.muttrc said `smtps://`), hence `starttls: false`.
    from: storagebaby@klees.io
    smtp_host: mail.klees.io
    smtp_port: 465
    starttls: false
    smtp_user: storagebaby@klees.io
# Backups. The kopia server is a built-in of Cradle and this block is the whole of what
# this host says about it: where the repository lives -- the same path `volume_overrides:
# kopia/repo` named until stage 2 --, the UI user the operator logs in as, the route label,
# and where the hourly off-site replica goes. The client passwords are generated on the
# host, one per backed-up service, and are in no file here.
#
# The repository path is deliberately outside `storage_roots.pool` (= /pool/apps): /apps
# has left the snapraid array and the repository must not go with it -- it is what protects
# that tree now, which is why this path must stay under no anchored exclude. The path
# follows the operator's existing structure -- /pool/backups/devices/ already holds
# CloudBaby, KAIZN-vps and StorageBaby. A filesystem path on this machine is a host fact,
# which is why it is here and not in the engine (Cradle's docs/ownership.md section 4).
backup:
  repository: /pool/backups/devices/StorageBaby/kopia
  username: jlk
  domain: kopia
  replica:
    s3_endpoint: s3.eu-central-003.backblazeb2.com
    s3_bucket: GTMyXab9-jlkkb
    # On, because the bucket has held the repository since the 2026-10-14 cutover: a
    # mistyped bucket then fails loudly instead of quietly starting a second, empty
    # repository. It was false for the first sync only.
    must_exist: true
# Empty, and required to be present: a path a service volume is pinned to against its
# class default. `kopia/repo` was the one entry until stage 2 and is `backup.repository`
# now. Nothing would refuse it if it were left here -- Cradle's static suite reads its own
# fixture host repository and never this one, and on a host the playbook applies
# `backup.repository` over this map silently -- so a leftover entry would be ignored
# without a word. It is empty because it has to be kept empty, not because it is guarded.
volume_overrides: {}
# The LAN address, explicitly: this host also has a VPN interface and Docker's leftover
# bridges, and Traefik's TCP entrypoints must bind the one address the scanner reaches.
# It is also what the FTP server advertises in its PASV reply. Give it a DHCP reservation.
tcp_bind_address: 192.168.178.2
deploy_timer: true
gpu: true
packages:
  [
    mesa,
    vulkan-mesa-layers,
    vulkan-radeon,
    vulkan-tools,
    vdpauinfo,
    libva-utils
  ]
# Empty: no service on this host overrides a `config:` value of its own folder. The one
# entry this ever held was the kopia server's, and the kopia server is a built-in now --
# `backup.replica` above is where the replica is configured. A `kopia` entry left here
# would be overridden silently by the built-in's own config, the same way the retired
# `volume_overrides` entry would be; only Cradle's own fixtures are checked for it.
service_config: {}
