domain: home.klees.io
acme: true
acme_email: email@janlucaklees.de
# The domains this host can obtain a certificate for -- one wildcard request each. Both
# are in the same Porkbun account, so the one resolver traefik declares covers them; the
# A records are the operator's. A service takes a name under one of these by writing it
# out in full in its own `service.yml`.
cert_zones: [home.klees.io, klees.io]
# The registries this host holds a login for (secrets/registries.sops.yaml). A service
# names the ones it needs; one it names that is not here is refused at converge.
registries: [ghcr.io]
tz: Europe/Berlin
storage_roots:
  pool: /pool/apps
  fast: /var/lib/storagebaby/fast
# The filesystems this host is made of. The `storage` role mounts exactly these and
# refuses to converge when one of them is missing -- which is what `mountpoints` used
# to do by hand. It never partitions, formats or wipes: a new disk is prepared once by
# hand (the role README, "Adding a disk") and then declared here.
#
# The partuuids and the parity `by-id` path are the ones the hand-stowed units this phase
# retired carried, and the names are what the deployed `snapraid.conf` already calls the
# disks -- renaming one would make snapraid treat that disk as new. Verify all four device
# paths against the running host before the first converge (root README, operator steps).
storage:
  disks:
    - {
        name: d1,
        device: /dev/disk/by-partuuid/a36d7f0a-aa65-4214-98e0-f3818954a494,
        mount: /mnt/data/data1,
        fstype: ext4
      }
    - {
        name: d2,
        device: /dev/disk/by-partuuid/243e4d8c-d018-4b9a-af9d-dcd3626138d4,
        mount: /mnt/data/data2,
        fstype: ext4
      }
    - {
        name: d3,
        device: /dev/disk/by-partuuid/d3b1a8bb-3da9-48dc-a082-2603cf186444,
        mount: /mnt/data/data3,
        fstype: ext4
      }
  parity:
    - {
        name: parity1,
        device: /dev/disk/by-id/ata-WDC_WD40EFRX-68N32N0_WD-WCC7K2EYYVV1-part1,
        mount: /mnt/parity/parity1,
        fstype: ext4
      }
  pool:
    mount: /pool
    options: defaults,allow_other,use_ino,category.create=pfrd,moveonenospc=true,minfreespace=20G,fsname=mergerfsPool,cache.writeback=false,cache.symlinks=false,cache.readdir=false,async_read=true,threads=4
  snapraid:
    block_size: 256
    # Paths are relative to a *disk's* root, which for a branch of this pool is the
    # same as relative to /pool.
    #
    # `/apps/` is excluded: snapraid cannot parity a file that is rewritten while it
    # reads it, which is what made the nightly run end in `exit:warning` on four soft
    # errors, every one of them a SQLite or appdata file under a running service. What
    # protects that tree instead is the kopia repository at
    # /pool/backups/devices/StorageBaby/kopia -- it sits outside /apps, so it stays in
    # the array, and a static test holds it out of every anchored exclude here.
    #
    # The design is 2026-10-14, section 3.1; this is its stage 2, carried out 2026-10-15
    # once `kopia snapshot list --all` showed immich@storagebaby:/data/upload complete.
    # What it costs: a dead disk now means restoring application state from last night's
    # snapshot rather than repairing it in place, and whatever under /apps has no
    # `backup:` block -- jellyfin's metadata above all -- is protected by nothing at all
    # (docs/ownership.md section 7, item 14). Reverting is one line and one converge: the
    # next sync re-parities /apps, long once.
    excludes:
      - '*.bak'
      - '*.unrecoverable'
      - /tmp/
      - /lost+found/
      - /apps/
      - .AppleDouble
      - ._AppleDouble
      - .DS_Store
      - .Thumbs.db
      - .fseventsd
      - .Spotlight-V100
      - .TemporaryItems
      - .Trashes
      - .AppleDB
      - '*.tmp'
      - '*.log'
      - /cache/
      # SQLite's write-ahead log and shared-memory files: rewritten constantly, worthless
      # in parity, and the database file beside them is what a restore needs.
      - '*.db-shm'
      - '*.db-wal'
    maintenance:
      on_calendar: '02:00'
      scrub_percent: 8
      scrub_older_days: 12
      # Services stopped before the balance moves their files between branches and started
      # again after the scrub -- and on failure, so a run that aborts never leaves one
      # down. Every name has to be a service placed on this host.
      stop_services: [jellyfin]
  # Where the maintenance report goes. `smtp_host` and `smtp_user` are operator items: the
  # deployed wrapper used whatever MTA the host happened to have, which this repository
  # never captured, so the relay has to be filled in before the first converge --
  # otherwise the mail step fails nightly while the run itself succeeds. The password is
  # hosts/StorageBaby/secrets/mail.sops.yaml, key `smtp_password`.
  mail:
    to: email@janlucaklees.de
    # The login, as the relay insists the sender be. 465 is implicit TLS on this relay
    # (the old ~/.muttrc said `smtps://`), hence `starttls: false`.
    from: storagebaby@klees.io
    smtp_host: mail.klees.io
    smtp_port: 465
    starttls: false
    smtp_user: storagebaby@klees.io
# The kopia repository, deliberately outside `storage_roots.pool` (= /pool/apps):
# /apps has left the snapraid array and the repository must not go with it -- it is
# what protects that tree now, which is why a static test asserts this path is under
# no anchored exclude. The path follows the operator's existing structure -- /pool/backups/devices/ already
# holds CloudBaby, KAIZN-vps and StorageBaby. A filesystem path on this machine is
# a host fact, which is why it is here and not in the service folder
# (docs/ownership.md section 4).
volume_overrides:
  kopia/repo: /pool/backups/devices/StorageBaby/kopia
# The LAN address, explicitly: this host also has a VPN interface and Docker's leftover
# bridges, and Traefik's TCP entrypoints must bind the one address the scanner reaches.
# It is also what the FTP server advertises in its PASV reply. Give it a DHCP reservation.
tcp_bind_address: 192.168.178.2
deploy_timer: true
gpu: true
packages:
  [
    mesa,
    vulkan-mesa-layers,
    vulkan-radeon,
    vulkan-tools,
    vdpauinfo,
    libva-utils
  ]
service_config: {}
