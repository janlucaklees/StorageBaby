name: kopia
port: 51515
domain: kopia
# The server speaks TLS itself, because its repository protocol is gRPC and gRPC is
# HTTP/2 -- Traefik reaches an HTTP/2 backend only over TLS. The certificate it
# re-encrypts to is the self-signed one the server makes for itself on first start, so
# there is nothing to verify it against; the hop is to 127.0.0.1. See the README.
route:
  scheme: https
  insecure_skip_verify: true
volumes:
  config: { class: pool }
  cache: { class: fast }
  logs: { class: fast }
  repo: { class: fast }
config:
  server_username: jlk
  repository: s3
  s3_endpoint: s3.eu-central-003.backblazeb2.com
  s3_bucket: storagebaby-kopia
secrets:
  - server_password
  - repository_password
  - b2_key_id
  - b2_application_key
  - client_paperless
  - client_openarchiver
  - client_immich
  - client_nextcloud
# One `client_<service>` per service with a `backup` block: the server's copy of the
# password that service holds as its own `kopia_password`. Deliberately redundant --
# the two services do not share configuration. `config/start.sh` registers
# `<service>@<host>` for each of them before the server binds.
backup: none
