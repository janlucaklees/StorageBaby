# LibreChat's own configuration file -- CONFIG_PATH=/config/librechat.yaml in the app unit.
# Copied verbatim into /etc/cradle/librechat/, never templated, and read once at startup.
#
# `version` is the one required key, and a version bump of the image keeps it in step.
# Everything else is the three blocks below -- the MCP allowlist, the cliproxy chat
# endpoint and speech-to-text. A restricted model list or a different file-upload policy
# would be written here too.
version: 1.3.15

# The MCP allowlist. On its defaults LibreChat allows a public MCP URL and refuses one that
# resolves to a private address -- its SSRF guard -- and inside this pod her hub's name
# resolves to the host gateway, which is exactly that. So the name is listed. Listing one
# turns the allowlist into a strict whitelist: every MCP server she adds in the UI from now
# on has to be named here or it is refused with "not in the allow list".
mcpSettings:
  allowedDomains:
    - mcp.mayu.klees.io

# The chat provider: `cliproxy` on this host, which holds the operator's own Claude,
# Codex, Gemini and Grok subscriptions and offers them back as an OpenAI-compatible API.
# The built-in OpenAI endpoint is gone from the selector because the app container no
# longer gets `OPENAI_API_KEY` -- see the unit; there is no `disabled:` key for it.
endpoints:
  custom:
    - name: 'CLIProxy'
      # Resolved from the app container's environment, where it arrives as a podman
      # secret. `${VAR}` is LibreChat's own syntax and the documented way to keep a
      # credential out of this file, which is copied into /etc/cradle/librechat/ in
      # the clear.
      apiKey: '${CLIPROXY_API_KEY}'
      # The public name, not a loopback port: rootless containers of different users
      # cannot reach each other's loopback, so this goes out through Traefik and back in.
      # The `AddHost=cliproxy.home.klees.io:host-gateway` that makes it resolve from
      # inside this pod is written by the role for every placed route, not here.
      baseURL: 'https://cliproxy.home.klees.io/v1'
      models:
        # The list that matters: LibreChat asks the proxy, so the dropdown is whatever
        # accounts are signed in to its panel, and adding one there needs no commit here.
        fetch: true
        # Required, and only a fallback for a fetch that fails -- then the endpoint is
        # still usable rather than empty. Catalog ids, so they are spelled the way the
        # proxy reports them; they are not a statement about which accounts exist.
        default:
          - claude-fable-5-1
          - claude-opus-5-5
          - claude-sonnet-5-5
          - gpt-6-astra
          - gpt-6.1-sol
          - gemini-4-argon
      # The title of a conversation is generated by whichever model it is being held
      # with, which keeps the naming on the same subscription as the conversation.
      titleConvo: true
      titleModel: 'current_model'
      modelDisplayLabel: 'CLIProxy'

# Speech-to-text through OpenAI's Whisper, and it takes two halves rather than one.
#
# `stt.openai` is what this *server* does with a recording: POST it to
# `https://api.openai.com/v1/audio/transcriptions` as `whisper-1`. `url` is left out
# because that endpoint is the provider's own default (`openAIProvider` in
# `api/server/services/Files/Audio/STTService.js`); `apiKey` and `model` are the schema's
# two required keys and everything else in it is optional. Exactly one provider may be
# named here -- the service counts the keys of this block and refuses two with "Multiple
# providers are set" (`listConfiguredSpeechProviders`), so an Azure block would replace
# this one rather than sit beside it.
#
# `speechTab.speechToText.engineSTT` is what the *browser* does with the microphone, and
# without it the block above is dead weight: the client's `engineSTT` defaults to
# `browser`, the Web Speech API, which transcribes in the browser and never asks this
# server for anything (`client/src/store/settings.ts`). `external` is the canonical name
# for "whatever the server configured"; `openai` is still accepted and normalised to it.
# It is a *default* and not a setting -- the client applies it only when that key is
# absent from the browser's local storage, so an account that has already touched the
# Speech tab keeps what it chose there (`client/src/hooks/Config/useSpeechSettingsInit.ts`).
#
# `${STT_API_KEY}` is resolved from the app's environment when a request is made, which is
# what lets a file copied verbatim carry a secret by reference: the value is the podman
# secret of that name, mounted `type=env` in the app's unit. A `${...}` whose variable is
# unset resolves to the literal string and is then sent as the bearer token -- so a
# missing secret is a 401 at the first dictation and not a startup error
# (`extractEnvVariable`, `packages/data-provider/src/utils.ts`). API keys are deliberately
# exempt from the sensitive-variable list that refuses this substitution for `JWT_SECRET`
# and `CREDS_KEY`, so the mechanism is upstream's intent and not a gap in it.
#
# No language is pinned, so Whisper detects one per recording. The Speech tab carries a
# language dropdown if naming one turns out to be better than detecting it.
speech:
  stt:
    openai:
      apiKey: '${STT_API_KEY}'
      model: whisper-1
  speechTab:
    speechToText:
      engineSTT: external
