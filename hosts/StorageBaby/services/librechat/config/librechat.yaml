# LibreChat's own configuration file -- CONFIG_PATH=/config/librechat.yaml in the app unit.
# Copied verbatim into /etc/cradle/librechat/, never templated, and read once at startup.
#
# `version` is the one required key, and a version bump of the image keeps it in step.
# Everything else stays on the app's defaults, which are enough for one user and one
# provider; a restricted model list or a different file-upload policy would be written
# here too.
version: 1.3.15

# The MCP allowlist. On its defaults LibreChat allows a public MCP URL and refuses one that
# resolves to a private address -- its SSRF guard -- and inside this pod her hub's name
# resolves to the host gateway, which is exactly that. So the name is listed. Listing one
# turns the allowlist into a strict whitelist: every MCP server she adds in the UI from now
# on has to be named here or it is refused with "not in the allow list".
mcpSettings:
  allowedDomains:
    - mcp.mayu.klees.io
