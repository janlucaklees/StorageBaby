name: openarchiver
# The app listens on 3000 inside the pod, and that is the whole of what this service has
# to say about ports. 3000 inside openarchiver's pod and 3000 inside yuzukam's no longer
# clash: each pod publishes on the loopback port Cradle derives for its route, and only
# the pod's publish line bridges the two -- nothing inside the pod knows the derived one.
container_port: 3000
domain: openarchiver
volumes:
  # `owner: 0` on `data`: the open-archiver entrypoint runs `pnpm install` before it
  # exec's and drops no privileges, so it is container root, which is the service
  # user -- and the tree is migrated in from the rootful stack root-owned, which only
  # a declared owner makes the role adopt. `meilisearch` is container root too
  # (v1.38 declares no USER) but starts empty, so the default is enough.
  data: { class: pool, owner: 0 }
  database: { class: fast, owner: 70 }
  meilisearch: { class: fast }
  # No `owner`: written by the dump timer's `podman exec`, i.e. container root. `pool`
  # and not `fast`: the SSD is 120G and a dump is a write-once nightly file, so it has no
  # business there -- every service's dump tree is on the pool.
  backups: { class: pool }
config:
  database_name: openarchiver
  database_user: openarchiver
  # How long a session token stays valid. Required by the app, not optional -- see the
  # README; `7d` is upstream's own default from its `.env.example`.
  jwt_expires_in: 7d
secrets:
  [
    database_password,
    redis_password,
    meili_master_key,
    jwt_secret,
    encryption_key,
    storage_encryption_key
  ]
backup:
  paths: [data, backups]
  schedule: '03:00'
  retention: { latest: 3, daily: 7, weekly: 4, monthly: 12, annual: 3 }
