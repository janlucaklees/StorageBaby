name: hermes
# The dashboard. The gateway's own OpenAI-compatible API listens on 8642 inside the
# container and is deliberately not published: the dashboard reaches it over the
# container's loopback, and nothing outside needs it.
port: 9119
# Private: it holds the model provider's API key, and the agent it drives has a shell.
# The pod publishes loopback only and the route is VPN-only on top of the dashboard's own
# login, which is mandatory rather than chosen -- see the unit.
domain: hermes
route:
  # The one endpoint upstream documents as public, so it answers whether or not the caller
  # holds a session. `/` is a redirect to the login page, which proves as much, but this is
  # also the dashboard's own health check and one probe is better than two.
  probe_path: /api/status
volumes:
  # Everything: the profile, the agent's memory, the skills it writes for itself, the
  # sessions, and the provider API key once it is entered in the dashboard. Small and
  # written constantly, so `fast`.
  #
  # 10000 is `HERMES_UID`'s own default, set explicitly in the unit beside it. The image
  # runs as root and its s6 init remaps an internal user to that uid, then drops each
  # supervised service to it -- so the files in here end up owned by 10000 whatever the
  # platform does, and declaring it is what makes the role's one-time chown agree.
  data: { class: fast, owner: 10000 }
# The dashboard's own login, and the key that signs its sessions. Not optional: the
# dashboard refuses to start on a non-loopback bind with no auth provider configured, so
# these three are what make the service run at all, not just what guards it.
secrets: [dashboard_user, dashboard_password, dashboard_session_key]
backup:
  paths: [data]
  schedule: '03:00'
  retention: { latest: 3, daily: 7, weekly: 4, monthly: 12, annual: 3 }
