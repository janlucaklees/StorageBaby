name: kopia
port: 51515
domain: kopia
# The server speaks TLS itself, because its repository protocol is gRPC and gRPC is
# HTTP/2 -- Traefik reaches an HTTP/2 backend only over TLS. The certificate it
# re-encrypts to is the self-signed one the server makes for itself on first start, so
# there is nothing to verify it against; the hop is to 127.0.0.1. See the README.
route:
  scheme: https
  insecure_skip_verify: true
volumes:
  config: { class: pool }
  cache: { class: fast }
  logs: { class: fast }
  # The repository itself, and the reason this is `pool` and not `fast`: it was an
  # empty stub while the repository lived in Backblaze, and it is now the primary
  # copy of every backup on this host. storagebaby overrides the path to
  # /pool/backups/devices/StorageBaby/kopia; a test host gets its pool root.
  repo: { class: pool }
config:
  server_username: jlk
  # `filesystem` on every host. The repository lives on local storage and Backblaze
  # is a replica fed by config/sync.sh -- which is what took kopia's daily garbage
  # collection off the metered link. `s3` is still accepted by start.sh and is what
  # this said until 2026-10-14; see the service README.
  repository: filesystem
secrets:
  - server_password
  - repository_password
  - b2_key_id
  - b2_application_key
  - client_paperless
  - client_openarchiver
  - client_immich
  - client_nextcloud
  - client_mealie
  - client_mcp
  - client_mailflow
  - client_openproject
  - client_hermes
# One `client_<service>` per service with a `backup` block: the server's copy of the
# password that service holds as its own `kopia_password`. Deliberately redundant --
# the two services do not share configuration. `config/start.sh` registers
# `<service>@<host>` for each of them before the server binds.
backup: none
