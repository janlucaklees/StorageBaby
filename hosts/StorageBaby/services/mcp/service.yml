name: mcp
container_port: 3002
# Private: `mcp` is the bare label the host's own `domain` completes, so this is
# mcp.home.klees.io on storagebaby and mcp.test.local on a test host. The endpoint is
# reached by OpenClaw on the same host and by a VPN client, never from the internet.
domain: mcp
# The hub registers `/:name` and `/:name/mcp` and nothing above them, so a request for `/`
# is a legitimate 404 -- not a route that fails to arrive. `/livez` is its own liveness
# endpoint, unauthenticated by design, and the one URL that answers without a token.
route:
  probe_path: /livez
volumes:
  # The hub's Ed25519 signing key, the OAuth clients that registered themselves, their
  # refresh tokens and the on-demand tool cache. Small, written often, and losing it makes
  # every connector re-authorise -- so `fast`, and backed up.
  # 1000: the hub image drops to the node base image's unprivileged `node` user.
  data: { class: fast, owner: 1000 }
  # The dm.de session the `mcp-dm` container renews, plus the break reports it writes.
  # Small, written often, so `fast` -- and the one thing in this service a person cannot
  # regenerate: dm.de rejects scripted logins, so a lost session.json means exporting
  # cookies out of a logged-in browser by hand.
  #
  # 1001, not 1000: that image ends on `USER pwuser`, and the playwright noble base
  # already has `ubuntu` at 1000, so `pwuser` landed on 1001. Read off the image
  # (`podman run --rm --entrypoint id <image> pwuser`), because the role creates this
  # directory 0750 and a wrong owner is a container that cannot write its session.
  dm_data: { class: fast, owner: 1001 }
config:
  # Copied verbatim into /etc/cradle/mcp/ -- `config/` is `ansible.builtin.copy`, not
  # a template, so these values are duplicated in config/hub/mcp.json by hand. They agree
  # because the three applications declare full `klees.io` names of their own, which are
  # the same on every host this service is placed on.
  mealie_url: https://mealie.klees.io
  nextcloud_host: https://nextcloud.klees.io
  paperless_url: https://paperless.klees.io
# `nextcloud_user` is not a secret and is here anyway: it is half of one credential, and
# the operator sets it in the same moment as the app password it belongs to. One file to
# open rather than two, and no pair that can drift apart. The account it names is the
# operator's own -- Nextcloud's data is per-user, so an adapter signed in as a dedicated
# account would see an empty Nextcloud rather than a narrower one.
#
# `dm_session_cookies` is the raw `cookie:` header of a logged-in dm.de browser -- the one
# secret here that is a person's credential rather than a machine's. There is no bearer for
# dm-mcp: it publishes no port and has no route, so the only thing that can reach it is the
# hub in this same pod. And no `github_token`: `mcp-dm` can file its own issues about a
# dead session, and that is off for now -- the unit says what turning it on takes.
secrets:
  [
    hub_password_hash,
    mealie_api_token,
    nextcloud_user,
    nextcloud_password,
    paperless_token,
    dm_session_cookies
  ]
# dm-mcp's image is published from a private repository, so its package is private too.
# The host offers ghcr.io and holds the login.
registries: [ghcr.io]
backup:
  paths: [data, dm_data]
  schedule: '03:00'
  retention: { latest: 3, daily: 7, weekly: 4, monthly: 12, annual: 3 }
