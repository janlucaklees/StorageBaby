name: mailflow
container_port: 80
domain: mailflow.klees.io
volumes:
  # Since 4.4 this also holds the sessions (migration 0076), which lived in redis before.
  database: { class: fast, owner: 70 }
  # 4.0.0's image proxy keeps the images it has fitted, so a second device or a later view
  # shows them at once. Upstream's compose file gives it a named volume; without one the
  # cache grows inside the container's writable layer and is thrown away on every restart.
  # 1000 is the `node` user the backend image runs as -- it is not root inside the
  # container and cannot chown a mount itself, so the role has to hand it over. Not in
  # `backup.paths`: every byte of it is re-fetchable from the message it belongs to.
  image_cache: { class: fast, owner: 1000 }
  # No `owner`: written by the dump timer's `podman exec` with no `-u`, i.e. container root,
  # which is the service user. `pool` because a write-once nightly file has no business on
  # the SSD.
  backups: { class: pool }
config:
  database_name: mailflow
  database_user: mailflow
  # Traefik and mailflow's own frontend (Caddy since 4.4, nginx before), so the backend reads the client address two hops back
  # in X-Forwarded-For. Upstream allows 2 only "if clients cannot reach MailFlow's ports
  # except through it", because otherwise a direct client picks the address it is
  # rate-limited and logged under. That holds here by construction: the pod publishes on
  # 127.0.0.1 alone, and a static test refuses any other bind.
  trust_proxy_hops: 2
  # The image proxy's cache ceiling, in MB per user, kept for a month. Upstream's default.
  image_cache_max_mb: 512
  # 4.0.5 ships MailFlow's own Microsoft OAuth app, so a personal Outlook.com or Hotmail
  # account connects without registering one in Microsoft Entra. Off here: no account on
  # this instance is a Microsoft one, and the default would put a third party's client
  # registration in the sign-in path for a provider nobody uses. The same switch is in the
  # UI under Settings > Email providers, so turning it on does not need a deploy.
  ms_builtin_app: false
secrets: [database_password, session_secret, encryption_key]
# Both images are JLK's fork (janlucaklees/mailflow), which is private on ghcr.io. The host
# offers ghcr.io and holds the login.
registries: [ghcr.io]
backup:
  # Only the dump. Every byte of mailflow's state is in Postgres: there is no upload tree,
  # no index and no cache worth carrying.
  paths: [backups]
  schedule: '03:00'
  retention: { latest: 3, daily: 7, weekly: 4, monthly: 12, annual: 3 }
