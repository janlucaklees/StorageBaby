name: nextcloud
# Three hostnames, so the `routes` list rather than the `domain:` + `container_port:`
# shorthand: nginx serves Nextcloud itself, Collabora serves the office backend and the
# Talk signaling server serves calls, and the browser has to reach each under its own
# name. They differ in how Traefik reaches them, which is what a per-entry backend option
# is for: nginx and the signaling server answer plain HTTP, Collabora keeps the TLS the
# image serves by default -- with a certificate it made for itself, which nothing can
# verify and nothing has to, the hop being to 127.0.0.1. The collabora unit has the why;
# kopia is the other service that does this.
routes:
  - { domain: nextcloud.klees.io, container_port: 80 }
  - {
      domain: collabora.klees.io,
      container_port: 9980,
      scheme: https,
      insecure_skip_verify: true
    }
  # Two labels under klees.io, so the host's `cert_zones` carries `nextcloud.klees.io` for
  # it: `*.klees.io` is one label deep. `/` is a 404 on the signaling server -- it
  # registers `/spreed` and `/api/v1/...` and nothing above them -- so the probe asks the
  # one unauthenticated endpoint it answers, measured against the pinned image.
  - {
      domain: signaling.nextcloud.klees.io,
      container_port: 8081,
      probe_path: /api/v1/welcome
    }
# TURN, for Talk: eturnal in nextcloud-talk, on both protocols, because a browser tries
# UDP first and falls back to TCP on a network that blocks it. 3478 is TURN's registered
# port and what Talk's `turn_servers` hands to clients. No relay range is published: the
# only peer a browser's allocation ever reaches is Janus, in this same pod, so the relayed
# media never leaves the namespace -- measured with an authenticated Allocate through the
# pod's loopback publish on both protocols.
tcp_ports:
  - { port: 3478 }
udp_ports:
  - { port: 3478 }
volumes:
  # 82, not 33: `www-data` is uid 82 in `php:*-fpm-alpine`, and the 33 in
  # `nextcloud:35-fpm-alpine` is the Nextcloud version.
  # The installation -- code, config, apps -- is `html` on the SSD, and the user files
  # are `data` on the pool, mounted over `/var/www/html/data` inside it. `datadirectory`
  # in config.php stays `/var/www/html/data`, so Nextcloud never sees the split.
  html: { class: fast, owner: 82 }
  data: { class: pool, owner: 82 }
  database: { class: fast, owner: 70 }
  # No `owner`: written by the dump timer's `podman exec`, i.e. container root. `pool`
  # and not `fast`: the SSD is 120G and a dump is a write-once nightly file, so it has no
  # business there -- every service's dump tree is on the pool.
  backups: { class: pool }
config:
  database_name: nextcloud
  database_user: oc_jlk
  version: 35-fpm-alpine
  # Postgres' own default is 128M, which is what initdb wrote into this database's
  # postgresql.conf when it was created. A host with less memory than this one
  # overrides it through `service_config.nextcloud`; the database unit has the
  # measurement behind the number.
  database_shared_buffers: 512MB
  # Empty on purpose, and measured: see "Trusted proxies" in the README. A host that
  # really does sit behind a second proxy sets it through `service_config.nextcloud`.
  trusted_proxies: ''
secrets:
  [
    database_password,
    collabora_username,
    collabora_password,
    admin_user,
    admin_password,
    signaling_secret,
    turn_secret,
    internal_secret
  ]
# The old stack's `make upgrade` ran the first five by hand after every image bump. The
# image itself runs `occ upgrade` from its entrypoint; these are the steps that came
# after it, and `when: unit_changed` (the default) is what makes them a deploy step --
# a version bump in `nextcloud-app.container.j2` runs them, the nightly no-op does not.
hooks:
  after_change:
    - {
        container: nextcloud-app,
        user: www-data,
        command: 'php occ maintenance:mode --off'
      }
    - {
        container: nextcloud-app,
        user: www-data,
        command: 'php occ db:add-missing-columns'
      }
    - {
        container: nextcloud-app,
        user: www-data,
        command: 'php occ db:add-missing-indices'
      }
    - {
        container: nextcloud-app,
        user: www-data,
        command: 'php occ db:add-missing-primary-keys'
      }
    - {
        container: nextcloud-app,
        user: www-data,
        command: 'php occ maintenance:repair --include-expensive'
      }
    # The two settings a domain change leaves behind, both read off this container's own
    # environment: a hook is `sh -c` inside the container, and `podman exec` inherits the
    # unit's Environment= lines, so `$NEXTCLOUD_TRUSTED_DOMAINS` and `$NEXTCLOUD_WOPI_URL`
    # are the rendered fqdns without any templating in this file. `when: always` because
    # a domain change is a host.yml edit, not a unit change of this service, and it has to
    # land on the converge that follows it. Index 1 is where the image's installer puts
    # the domain it was given; index 0 is the installer's own entry.
    - {
        container: nextcloud-app,
        user: www-data,
        when: always,
        command: 'php occ config:system:set trusted_domains 1 --value="$NEXTCLOUD_TRUSTED_DOMAINS"'
      }
    - {
        container: nextcloud-app,
        user: www-data,
        when: always,
        command: 'php occ config:app:set richdocuments wopi_url --value="$NEXTCLOUD_WOPI_URL"'
      }
    # Talk's four settings, the same way and for the same reason, plus one more: two of
    # them carry a secret, and the secret lives in sops rather than in the admin page. The
    # values are the app container's own environment -- the two routes' names and the two
    # env-type secrets it shares with nextcloud-talk -- so a secret is expanded inside the
    # container and never appears in a command the converge logs; `--quiet` because occ
    # otherwise echoes the value it set. `--type=array` and `--sensitive` are what Talk's
    # own config lexicon declares for these keys, and writing them before the app is
    # installed is harmless: the app reads them when it is. `signaling_servers_secret` is
    # written beside the array because `talk:signaling:add` writes both and Talk reads the
    # string first. The shape of each value is what the app's own occ commands write.
    - {
        container: nextcloud-app,
        user: www-data,
        when: always,
        command: 'php occ config:app:set spreed signaling_servers --type=array --sensitive --quiet --value="{\"servers\":[{\"server\":\"$TALK_SIGNALING_URL\",\"verify\":true}],\"secret\":\"$TALK_SIGNALING_SECRET\"}"'
      }
    - {
        container: nextcloud-app,
        user: www-data,
        when: always,
        command: 'php occ config:app:set spreed signaling_servers_secret --sensitive --quiet --value="$TALK_SIGNALING_SECRET"'
      }
    - {
        container: nextcloud-app,
        user: www-data,
        when: always,
        command: 'php occ config:app:set spreed turn_servers --type=array --sensitive --quiet --value="[{\"schemes\":\"turn\",\"server\":\"$TALK_TURN_SERVER\",\"secret\":\"$TALK_TURN_SECRET\",\"protocols\":\"udp,tcp\"}]"'
      }
    # eturnal answers STUN on the same port, so the default `stun.nextcloud.com:443` --
    # a third party learning every caller's address -- is replaced by this host.
    - {
        container: nextcloud-app,
        user: www-data,
        when: always,
        command: 'php occ config:app:set spreed stun_servers --type=array --sensitive --quiet --value="[\"$TALK_TURN_SERVER\"]"'
      }
backup:
  # `html` is the installation, `data` the user files, `backups` carries the nightly
  # dump. `database` is deliberately absent -- a database is backed up as a dump, never
  # as its data directory.
  paths: [html, data, backups]
  schedule: '03:00'
  retention: { latest: 3, daily: 7, weekly: 4, monthly: 12, annual: 3 }
