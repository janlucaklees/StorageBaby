; APCu is Nextcloud's local memory cache (`memcache.local`, set by the image's own
; apcu.config.php), and it runs in PHP's default 32M of shared memory -- the image
; ships `extension=apcu` and `apc.enable_cli=1` and nothing else. Nextcloud's
; documentation gives 128M, and this installation has around fifty apps whose
; appconfig and app metadata all live in here.
;
; Mounted as zz-apcu.ini so it is read after the image's own docker-php-ext-apcu.ini.
apc.shm_size=128M
