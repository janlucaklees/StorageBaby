name: paperless
port: 8000
domain: paperless.klees.io
volumes:
  data: { class: pool, owner: 1000 }
  media: { class: pool, owner: 1000 }
  # The scanner's inbox, and the only volume of this service that is meant to be empty:
  # the consumer deletes every file it has ingested, so nothing here outlives an import.
  # `fast` for that reason -- it is a spool, not an archive -- and it is deliberately
  # absent from `backup.paths` below.
  # 1000 twice over: paperless-ngx runs as it, and paperless-ftp creates its virtual
  # user as uid/gid 1000 so an upload lands as the uid the consumer expects.
  consume: { class: fast, owner: 1000 }
  database: { class: fast, owner: 70 }
  # No `owner`: the dump timer writes here through `podman exec` with no `-u`, which
  # is container root, which is the service user -- what the role creates it as.
  backups: { class: fast }
tcp_ports:
  # Traefik listens on 21 and forwards to the pod's 2121: the control connection. 21
  # because that is the only port a printer's FTP client offers to speak, and it is why
  # `host_base` lowers the unprivileged-port sysctl on this host.
  - { port: 21, target: 2121 }
  # The passive data connections. Each port is forwarded to itself, which a range always
  # is: the server advertises the port it is listening on in its PASV reply, and a
  # rewritten port would send the client somewhere nothing answers. Ten of them is ten
  # simultaneous transfers, which is nine more than one scanner needs.
  - { range: [21100, 21109] }
config:
  database_name: paperless
  database_user: paperless
  ocr_language: deu
  # Empty on purpose, and measured: see "Trusted proxies" in the README. A host that
  # really does sit behind a second proxy sets it through `service_config.paperless`.
  trusted_proxies: ''
  # The one FTP account. Its password is the `ftp_password` secret, and the two together
  # are the whole of what the scanner is configured with.
  ftp_user: scanner
secrets: [database_password, secret_key, ftp_password, kopia_password]
hooks:
  after_change:
    - { container: paperless-app, command: 'touch /tmp/.hook-ran' }
backup:
  paths: [data, media, backups]
  schedule: '03:00'
  retention: { latest: 3, daily: 7, weekly: 4, monthly: 12, annual: 3 }
