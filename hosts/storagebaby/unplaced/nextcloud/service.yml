name: nextcloud
# Two hostnames, so the `routes` list rather than the `domain:` + `port:` shorthand:
# nginx serves Nextcloud itself and Collabora serves the office backend, and the
# browser has to reach both under their own names. They differ in how Traefik reaches
# them, which is what a per-entry backend option is for: nginx answers plain HTTP,
# Collabora keeps the TLS the image serves by default -- with a certificate it made
# for itself, which nothing can verify and nothing has to, the hop being to 127.0.0.1.
# The collabora unit has the why; kopia is the other service that does this.
routes:
  - { domain: nextcloud, port: 8280 }
  - { domain: collabora, port: 9980, scheme: https, insecure_skip_verify: true }
volumes:
  html: { class: pool }
  database: { class: fast }
  backups: { class: fast }
config:
  database_name: nextcloud
  database_user: oc_jlk
  version: 33-fpm-alpine
  # Empty on purpose, and measured: see "Trusted proxies" in the README. A host that
  # really does sit behind a second proxy sets it through `service_config.nextcloud`.
  trusted_proxies: ''
secrets:
  [
    database_password,
    collabora_username,
    collabora_password,
    admin_user,
    admin_password
  ]
host_secrets:
  kopia_password: kopia-clients.nextcloud
# The old stack's `make upgrade` ran these five by hand after every image bump. The
# image itself runs `occ upgrade` from its entrypoint; these are the steps that came
# after it, and `when: unit_changed` (the default) is what makes them a deploy step --
# a version bump in `nextcloud-app.container.j2` runs them, the nightly no-op does not.
hooks:
  after_change:
    - {
        container: nextcloud-app,
        user: www-data,
        command: 'php occ maintenance:mode --off'
      }
    - {
        container: nextcloud-app,
        user: www-data,
        command: 'php occ db:add-missing-columns'
      }
    - {
        container: nextcloud-app,
        user: www-data,
        command: 'php occ db:add-missing-indices'
      }
    - {
        container: nextcloud-app,
        user: www-data,
        command: 'php occ db:add-missing-primary-keys'
      }
    - {
        container: nextcloud-app,
        user: www-data,
        command: 'php occ maintenance:repair --include-expensive'
      }
backup:
  # `html` is the installation and the user data under it; `backups` carries the
  # nightly dump. `database` is deliberately absent -- a database is backed up as a
  # dump, never as its data directory.
  paths: [html, backups]
  schedule: '03:00'
  retention: { latest: 3, daily: 7, weekly: 4, monthly: 12, annual: 3 }
