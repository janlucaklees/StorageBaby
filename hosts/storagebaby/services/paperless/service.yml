name: paperless
port: 8000
domain: paperless
volumes:
  data: { class: pool }
  media: { class: pool }
  database: { class: fast }
  broker: { class: fast }
  backups: { class: fast }
config:
  database_name: paperless
  database_user: paperless
  ocr_language: deu
  # Empty on purpose, and measured: see "Trusted proxies" in the README. A host that
  # really does sit behind a second proxy sets it through `service_config.paperless`.
  trusted_proxies: ''
secrets: [database_password, secret_key]
host_secrets:
  kopia_password: kopia-clients.paperless
hooks:
  after_change:
    - {
        container: paperless-app,
        command: 'touch /usr/src/paperless/data/.hook-ran'
      }
backup:
  paths: [data, media, backups]
  schedule: '03:00'
  retention: { latest: 3, daily: 7, weekly: 4, monthly: 12, annual: 3 }
