# A test-only fixture, placed on the test hosts and nowhere else.
#
# It is the one service on the platform that claims a `tcp_ports` entry until Paperless's
# FTP part lands, and it exists so the TCP path can be measured end to end rather than
# only rendered: it echoes back whatever is sent to it, which is a payload a test can
# check without speaking a protocol. `test_traefik.py` connects to the VM's own routable
# address on 7777 -- through Traefik's entrypoint, not to the container's loopback -- and
# asserts the echo comes back.
#
# A real folder under each test host and not a symlink: there is no storagebaby service
# to link to and there must never be one, because this container has no business on the
# NAS. The copy under the other test host is byte-identical, and a static test says so.
name: tcp-echo
volumes: {}
secrets: []
backup: none
# 7777 is the public entrypoint Traefik binds on every address; 17777 is where the
# container publishes on loopback. The two differ deliberately: `target` is the half an
# FTP control port needs (21 -> 2121), and a fixture using one number for both would
# render fine and prove nothing about it.
tcp_ports: [{ port: 7777, target: 17777 }]
