domain: test.local
acme: false
acme_email: test@test.local
tz: Europe/Berlin
storage_roots:
  pool: /srv/pool
  fast: /srv/fast
# The test VM has one filesystem; both storage roots are ordinary directories on it.
mountpoints: []
volume_overrides: {}
deploy_timer: false
gpu: false
packages: []
# A test host has no Backblaze account, so kopia gets a local repository under its
# `repo` volume instead of the S3 one storagebaby declares.
service_config:
  kopia:
    repository: filesystem
