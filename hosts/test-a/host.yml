domain: test.local
acme: false
acme_email: test@test.local
tz: Europe/Berlin
storage_roots:
  pool: /pool/apps
  fast: /srv/fast
# Four 4 GB virtual disks the Molecule harness attaches, partitions and labels: the
# device paths are GPT partition labels it writes from these very `name`s, so the
# tracked file names the disks and the harness makes those names exist. It has to be a
# stable name in the repository rather than a generated inventory variable --
# `test_deploy.py` converges through `ansible-pull`, which sees no Molecule inventory,
# and a different `What=` on that run would remount /pool under the running services'
# bind mounts. `minfreespace` is the one option that cannot be storagebaby's: 20G on a
# 4 GB branch means every create fails.
storage:
  disks:
    - {
        name: d1,
        device: /dev/disk/by-partlabel/d1,
        mount: /mnt/data/data1,
        fstype: ext4
      }
    - {
        name: d2,
        device: /dev/disk/by-partlabel/d2,
        mount: /mnt/data/data2,
        fstype: ext4
      }
    - {
        name: d3,
        device: /dev/disk/by-partlabel/d3,
        mount: /mnt/data/data3,
        fstype: ext4
      }
  parity:
    - {
        name: parity1,
        device: /dev/disk/by-partlabel/parity1,
        mount: /mnt/parity/parity1,
        fstype: ext4
      }
  pool:
    mount: /pool
    options: defaults,allow_other,use_ino,category.create=pfrd,moveonenospc=true,minfreespace=100M,fsname=mergerfsPool,cache.writeback=false,cache.symlinks=false,cache.readdir=false,async_read=true,threads=2
  # The array. `excludes` are paths relative to a *disk's* root, which for a branch of this
  # pool is the same as relative to /pool. storagebaby's list verbatim, so the rendered
  # snapraid.conf a test host parses is the same shape as the real one.
  snapraid:
    block_size: 256
    excludes:
      - '*.bak'
      - '*.unrecoverable'
      - /tmp/
      - /lost+found/
      - .AppleDouble
      - ._AppleDouble
      - .DS_Store
      - .Thumbs.db
      - .fseventsd
      - .Spotlight-V100
      - .TemporaryItems
      - .Trashes
      - .AppleDB
      - /apps/nextcloud/data/jlk/files/Projects/Kannji/_app_workspace/app/build/
      - '*.tmp'
      - '*.log'
      - /cache/
      # SQLite's write-ahead log and shared-memory files: rewritten constantly, worthless
      # in parity, and the database file beside them is what a restore needs.
      - '*.db-shm'
      - '*.db-wal'
    maintenance:
      on_calendar: '02:00'
      balance_threshold: 5
      scrub_percent: 8
      scrub_older_days: 12
      # jellyfin is placed here, so the run stops it before the balance moves its files
      # between branches, exactly as on storagebaby.
      stop_services: [jellyfin]
  # The throwaway SMTP sink `prepare.yml` installs on the VM, on the loopback. `tls: false`
  # because nothing but the loopback is between the two ends, and `auth: plain` explicitly
  # because msmtp's automatic choice considers only SCRAM without TLS -- against a sink that
  # offers PLAIN it would fail to authenticate and never send, and the maintenance run would
  # still be green. The password is generated into hosts/<host>/secrets/mail.sops.yaml by
  # `prepare.yml`, like every other test secret.
  mail:
    to: root@test.local
    from: storagebaby@test.local
    smtp_host: 127.0.0.1
    smtp_port: 2525
    smtp_user: test
    tls: false
    auth: plain
volume_overrides: {}
deploy_timer: false
gpu: false
packages: []
# A test host has no Backblaze account, so kopia gets a local repository under its
# `repo` volume instead of the S3 one storagebaby declares.
service_config:
  kopia:
    repository: filesystem
