- name: Converge a StorageBaby host
  hosts: all
  become: true
  gather_facts: false
  vars:
    storagebaby_repo_root: '{{ playbook_dir }}/..'
    render_only: false
    render_output: ''
    # The address Traefik's plain-TCP entrypoints bind. Not the wildcard: an entrypoint on
    # `:<port>` and a pod publishing `127.0.0.1:<port>` are mutually exclusive on Linux
    # (EADDRINUSE, whichever binds second), and `target == port` is exactly what an FTP
    # passive range needs -- the server advertises the port it listens on, so the two sides
    # have to agree. One concrete address for Traefik and loopback for the pod keeps both.
    # A lazy default: it is only evaluated where a template really reads it, so a host that
    # places no TCP port never needs the fact. `host.yml` overrides it (include_vars outranks
    # play vars) on a host whose default route is not the address a client comes in on.
    tcp_bind_address: '{{ ansible_default_ipv4.address }}'
    # The zones Traefik asks Let's Encrypt for a wildcard certificate for -- one `domains`
    # entry each on the router that carries the resolver. A lazy default like the address
    # above: a host that serves only its own domain declares nothing, and a host whose
    # services take names under another zone lists both in `host.yml` (include_vars
    # outranks play vars). It is the host's statement of which domains it can certify at
    # all; `docs/ownership.md` § 4.2 has where that is going.
    cert_zones: '{{ [domain] }}'
  pre_tasks:
    - name: Load host configuration
      ansible.builtin.include_vars:
        file: '{{ storagebaby_repo_root }}/hosts/{{ inventory_hostname }}/host.yml'

    # `find` runs on the controller, which is where the repo lives: the devtools
    # container for a Molecule run, the host itself for ansible-pull. The fileglob
    # lookup cannot do this -- it globs only the basename, never a wildcard in a
    # directory component, so `*/service.yml` silently matches nothing.
    # `follow: true` is what makes a placement work: a service folder lives once
    # under its owning host (or under shared/) and every other host that runs it
    # links to it. Without this, os.walk refuses to descend a symlinked directory
    # and the linked service is silently never placed.
    - name: Discover shared service specs
      ansible.builtin.find:
        paths: '{{ storagebaby_repo_root }}/hosts/shared/services'
        patterns: service.yml
        recurse: true
        depth: 2
        follow: true
      delegate_to: localhost
      become: false
      register: _shared_specs

    - name: Discover this host's service specs
      ansible.builtin.find:
        paths: '{{ storagebaby_repo_root }}/hosts/{{ inventory_hostname }}/services'
        patterns: service.yml
        recurse: true
        depth: 2
        follow: true
      delegate_to: localhost
      become: false
      register: _host_specs

    - name: Collect placed services (shared first, then this host's)
      ansible.builtin.set_fact:
        placed_services: >-
          {{ (_shared_specs.files | map(attribute='path') | sort)
             + (_host_specs.files | map(attribute='path') | sort) }}

    # Every route name placed on this host, collected here and not in the role: the
    # role runs once per service and can only see its own spec, while what each
    # service needs is the *host's* whole list. The `service` role renders it into a
    # Quadlet drop-in per service so those names resolve to the host gateway from
    # inside a container -- `ansible/roles/service/README.md`, "Reaching another
    # service through Traefik", has the why.
    - name: Collect the route names of every placed service
      ansible.builtin.set_fact:
        _placed_route_domains: >-
          {{ (_placed_route_domains | default([]))
             + (_spec.routes | default([]) | map(attribute='domain') | list)
             + ([_spec.domain] if _spec.domain is defined else []) }}
      vars:
        _spec: "{{ lookup('file', placed_service) | from_yaml }}"
      loop: '{{ placed_services }}'
      loop_control:
        loop_var: placed_service
        label: '{{ placed_service | dirname | basename }}'

    # Sorted and de-duplicated so the rendered drop-in is byte-stable: the role
    # restarts a unit whose drop-in changed, and a list that came back in a different
    # order every run would restart every service on every converge. Sorted *after*
    # the suffix is joined on, because that is the string the static test asserts the
    # rendered file against -- and the two orders differ as soon as one route name is
    # another plus a suffix: `-` sorts before `.`, so a pair like `paperless` and
    # `paperless-scan` comes out the other way round when the bare names are sorted first.
    # A route name carrying a dot is already a full hostname and is left alone; a bare
    # label is completed with the host's own domain. Same rule as `tasks/main.yml`, and
    # the reason the two forms are partitioned rather than mapped: Jinja has no way to
    # apply a conditional through `map`, and a `regex_replace` doing it would need a
    # backreference, which Jinja string literals mangle.
    - name: The host's route fqdns, in a stable order
      ansible.builtin.set_fact:
        placed_fqdns: >-
          {{ ((_names | select('search', '[.]') | list)
              + (_names | reject('search', '[.]') | product(['.' ~ domain]) | map('join') | list))
             | sort | list }}
      vars:
        _names: '{{ _placed_route_domains | default([]) | unique }}'

    # The host's TCP listeners, collected here for the same reason `placed_fqdns` is: a
    # service's spec knows its own ports, and what traefik's unit and the unprivileged
    # port sysctl need is the *host's* whole list.
    - name: Collect the TCP port declarations of every placed service
      ansible.builtin.set_fact:
        _placed_tcp: >-
          {{ (_placed_tcp | default([])) + (_spec.tcp_ports | default([])) }}
      vars:
        _spec: "{{ lookup('file', placed_service) | from_yaml }}"
      loop: '{{ placed_services }}'
      loop_control:
        loop_var: placed_service
        label: '{{ placed_service | dirname | basename }}'

    # A range expands to one port per entry, because one Traefik entrypoint binds one
    # port -- there is no range form of `--entrypoints.<name>.address`. Only the
    # entrypoint side is collected: where each port forwards to is the service's own
    # business and stays in the route template.
    - name: Expand every declared TCP port, ranges included
      ansible.builtin.set_fact:
        _tcp_expanded: >-
          {{ (_tcp_expanded | default([]))
             + (range(tcp_entry.range[0], tcp_entry.range[1] + 1) | list
                if tcp_entry.range is defined else [tcp_entry.port]) }}
      loop: '{{ _placed_tcp | default([]) }}'
      loop_control:
        loop_var: tcp_entry
        label: '{{ tcp_entry }}'

    # Sorted and de-duplicated, like placed_fqdns and for the same reason: it is rendered
    # into traefik's unit, and a list in a different order every run would restart traefik
    # on every converge.
    - name: The host's TCP entrypoint ports, in a stable order
      ansible.builtin.set_fact:
        placed_tcp_ports: '{{ _tcp_expanded | default([]) | unique | sort | list }}'

    # The one fact this play needs, gathered only where it is needed. `gather_facts: false`
    # at the top is deliberate -- this play runs every five minutes from the deploy timer --
    # so the network subset is collected here and only on a host that really renders a TCP
    # entrypoint. A host with no default route (or one whose default route is not the address
    # clients arrive on) sets `tcp_bind_address` in its `host.yml`; without either, the
    # traefik template fails loudly on `ansible_default_ipv4` having no `address`, which is
    # the right outcome -- the wildcard it would otherwise fall back to is the collision this
    # exists to avoid. Not under `render_only`: there are no host facts worth gathering on
    # the controller, and the render passes `tcp_bind_address` in as a placeholder instead.
    - name: Gather the network facts the TCP entrypoint address comes from
      ansible.builtin.setup:
        gather_subset: ['!all', 'network']
      when:
        - placed_tcp_ports | length > 0
        - not (render_only | bool)
  roles:
    # Before host_base, which creates the storage class roots *below* the pool: nothing
    # may write there until the pool is mounted, and asserting that is what this role
    # replaced `mountpoints` with. Skipped on a host that declares no `storage` -- the
    # role converges a declaration, it is not a requirement every host has to meet.
    - role: storage
      when: storage is defined
    # `| bool`: ansible-core rejects a non-boolean conditional, and an
    # `-e render_only=...` on the command line arrives as a string.
    - role: host_base
      when: not (render_only | bool)
  tasks:
    # `service` and `service_dir` are lazy templates evaluated inside the role, so the
    # loop variable must not be `item`: any loop within the role would shadow it and
    # resolve these against the inner loop's item instead.
    # The per-host `service_config` override is merged into `service.config` here and
    # not inside the role: `service` arrives as an include_role param, and a role param
    # outranks every set_fact the role could make -- the merged copy would be silently
    # discarded. `_spec` is a lazy var like the others: it is re-read on every
    # reference, and only ever on the controller, where the repo is.
    - name: Apply the service role per placed service
      ansible.builtin.include_role:
        name: service
      vars:
        _spec: "{{ lookup('file', placed_service) | from_yaml }}"
        service: >-
          {{ _spec | combine({'config': (_spec.config | default({}))
             | combine((service_config | default({}))[_spec.name] | default({}), recursive=True)}) }}
        service_dir: '{{ placed_service | dirname }}'
      loop: '{{ placed_services }}'
      loop_control:
        loop_var: placed_service
        label: '{{ placed_service | dirname | basename }}'

    # Last, after every service has had its turn. A hook waits ten minutes for the
    # container it execs into to become healthy and then gives up *without* failing the
    # play, because failing there would take every service sorted after this one down
    # with it -- the role is included once per service from this one play, so a single
    # application that cannot start (a wrong database password against a migrated
    # cluster) would stop half the host from converging, nightly, from the deploy timer.
    # The converge still has to report it, or a service left un-upgraded would be
    # invisible in a green `ansible-pull`. So the role collects them in `hooks_not_run`
    # and the failure is raised here, where nothing is waiting behind it.
    - name: Fail when a service's after-change hooks could not run
      ansible.builtin.fail:
        msg: >-
          After-change hooks were skipped for: {{ hooks_not_run
          | map(attribute='service') | join(', ') }}. The containers that never became
          healthy: {{ hooks_not_run | map(attribute='containers') | flatten | join(', ') }}.
          Those services are converged but not finished -- read the journal of each
          (`storagebaby-svc logs <name>`) from the top. Every other service converged.
      when: hooks_not_run | default([]) | length > 0
