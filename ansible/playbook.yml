- name: Converge a StorageBaby host
  hosts: all
  become: true
  gather_facts: false
  vars:
    storagebaby_repo_root: '{{ playbook_dir }}/..'
    render_only: false
    render_output: ''
  pre_tasks:
    - name: Load host configuration
      ansible.builtin.include_vars:
        file: '{{ storagebaby_repo_root }}/hosts/{{ inventory_hostname }}/host.yml'

    # `find` runs on the controller, which is where the repo lives: the devtools
    # container for a Molecule run, the host itself for ansible-pull. The fileglob
    # lookup cannot do this -- it globs only the basename, never a wildcard in a
    # directory component, so `*/service.yml` silently matches nothing.
    # `follow: true` is what makes a placement work: a service folder lives once
    # under its owning host (or under shared/) and every other host that runs it
    # links to it. Without this, os.walk refuses to descend a symlinked directory
    # and the linked service is silently never placed.
    - name: Discover shared service specs
      ansible.builtin.find:
        paths: '{{ storagebaby_repo_root }}/hosts/shared/services'
        patterns: service.yml
        recurse: true
        depth: 2
        follow: true
      delegate_to: localhost
      become: false
      register: _shared_specs

    - name: Discover this host's service specs
      ansible.builtin.find:
        paths: '{{ storagebaby_repo_root }}/hosts/{{ inventory_hostname }}/services'
        patterns: service.yml
        recurse: true
        depth: 2
        follow: true
      delegate_to: localhost
      become: false
      register: _host_specs

    - name: Collect placed services (shared first, then this host's)
      ansible.builtin.set_fact:
        placed_services: >-
          {{ (_shared_specs.files | map(attribute='path') | sort)
             + (_host_specs.files | map(attribute='path') | sort) }}

    # Every route name placed on this host, collected here and not in the role: the
    # role runs once per service and can only see its own spec, while what each
    # service needs is the *host's* whole list. The `service` role renders it into a
    # Quadlet drop-in per service so those names resolve to the host gateway from
    # inside a container -- `ansible/roles/service/README.md`, "Reaching another
    # service through Traefik", has the why.
    - name: Collect the route names of every placed service
      ansible.builtin.set_fact:
        _placed_route_domains: >-
          {{ (_placed_route_domains | default([]))
             + (_spec.routes | default([]) | map(attribute='domain') | list)
             + ([_spec.domain] if _spec.domain is defined else []) }}
      vars:
        _spec: "{{ lookup('file', placed_service) | from_yaml }}"
      loop: '{{ placed_services }}'
      loop_control:
        loop_var: placed_service
        label: '{{ placed_service | dirname | basename }}'

    # Sorted and de-duplicated so the rendered drop-in is byte-stable: the role
    # restarts a unit whose drop-in changed, and a list that came back in a different
    # order every run would restart every service on every converge.
    - name: The host's route fqdns, in a stable order
      ansible.builtin.set_fact:
        placed_fqdns: >-
          {{ _placed_route_domains | default([]) | unique | sort
             | product(['.' ~ domain]) | map('join') | list }}
  roles:
    # `| bool`: ansible-core rejects a non-boolean conditional, and an
    # `-e render_only=...` on the command line arrives as a string.
    - role: host_base
      when: not (render_only | bool)
  tasks:
    # `service` and `service_dir` are lazy templates evaluated inside the role, so the
    # loop variable must not be `item`: any loop within the role would shadow it and
    # resolve these against the inner loop's item instead.
    # The per-host `service_config` override is merged into `service.config` here and
    # not inside the role: `service` arrives as an include_role param, and a role param
    # outranks every set_fact the role could make -- the merged copy would be silently
    # discarded. `_spec` is a lazy var like the others: it is re-read on every
    # reference, and only ever on the controller, where the repo is.
    - name: Apply the service role per placed service
      ansible.builtin.include_role:
        name: service
      vars:
        _spec: "{{ lookup('file', placed_service) | from_yaml }}"
        service: >-
          {{ _spec | combine({'config': (_spec.config | default({}))
             | combine((service_config | default({}))[_spec.name] | default({}), recursive=True)}) }}
        service_dir: '{{ placed_service | dirname }}'
      loop: '{{ placed_services }}'
      loop_control:
        loop_var: placed_service
        label: '{{ placed_service | dirname | basename }}'
