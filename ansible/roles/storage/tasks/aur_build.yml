# Build and install one AUR package on the host. Takes `aur_package`, `aur_commit` (the
# pin) and `aur_version` (the `pkgver-pkgrel` that commit produces, or `''`).
#
# `aur_version: ''` is for a `-git` recipe, whose `pkgver()` runs at build time and produces
# a version from the upstream commit it checked out -- not knowable in advance, and never
# equal to the `.SRCINFO` one. Such a package is guarded on a stamp recording the AUR commit
# it was built from; every other one is guarded on the declared version, which is the
# stronger check because it also catches a pin bumped without its version.
#
# For a package that is in neither Arch's official repositories nor Chaotic-AUR. The
# whole file is one block under one condition -- the pinned version is not the installed
# version -- so a converged host does no clone, no compile and no network at all, and the
# nightly deploy timer reports no change.
#
# The build user gets **no** sudo or doas rights, deliberately: `makepkg -s` would need
# to run pacman as root, and a NOPASSWD pacman rule for a service account is a
# root-equivalent grant that outlives the build. Instead the dependencies are read out of
# the pinned `.SRCINFO` and installed by this play, which is already root, and `makepkg`
# runs without `-s`.
# `check_mode: false` on the probe and `not ansible_check_mode` on the block are two halves
# of one thing: a `--check --diff` run is the pre-flight an operator makes against the live
# NAS before pushing a pool change, and it has to reach the mount templates. `command` does
# not support check mode, so without the first line the probe is skipped and its registered
# result has no `stdout` for the block's `when:` to read; without the second, a host whose
# snapraid is not already the pinned version would clone, compile and install from a run
# that promised to change nothing.
- name: Look for an installed copy of {{ aur_package }}
  ansible.builtin.command: pacman -Q {{ aur_package }}
  register: _aur_installed
  changed_when: false
  failed_when: false
  check_mode: false

# "<name> <version>" minus the name, and empty when the package is not installed at all.
- name: The installed version of {{ aur_package }}
  ansible.builtin.set_fact:
    _aur_installed_version: "{{ (_aur_installed.stdout | trim | regex_replace('^\\S+\\s+', '')) if _aur_installed.rc == 0 else '' }}"

- name: Look for the build stamp of {{ aur_package }}
  ansible.builtin.slurp:
    src: '{{ aur_build_home }}/stamps/{{ aur_package }}'
  register: _aur_stamp
  failed_when: false
  check_mode: false

# Which way the installed version differs from the pin, and not merely *that* it does.
# `pacman -Q` prints "<name> <version>"; `vercmp` is pacman's own comparison of two of
# those version strings and answers -1, 0 or 1. An inequality alone would treat a *newer*
# installed copy as a mismatch and `pacman -U` the pin over it -- a silent downgrade of the
# program that owns the parity of a live array, from the nightly deploy timer, the first
# time the operator's own `pacman -Syu` moves snapraid ahead of the pin. Bumping the pin is
# how a version moves forward; nothing here moves one back.
- name: Compare the installed version with the pin -- {{ aur_package }}
  ansible.builtin.command: vercmp {{ _aur_installed_version }} {{ aur_version }}
  register: _aur_vercmp
  when:
    - _aur_installed.rc == 0
    - aur_version | length > 0
  changed_when: false
  check_mode: false

# Loud rather than silent, and not a failure: leaving a newer package alone is the right
# outcome, but an operator reading a converge has to be able to see that the declaration in
# git is not what the host runs.
- name: Installed newer than the pin, and left alone -- {{ aur_package }}
  ansible.builtin.debug:
    msg: >-
      {{ aur_package }} {{ _aur_installed_version }} is installed and newer than the pinned
      {{ aur_version }}. Leaving it: this role does not downgrade a package. Bump
      {{ aur_package }}'s pin in ansible/roles/storage/defaults/main.yml -- the commit and
      the version together -- if the declaration is meant to catch up.
  when:
    - aur_version | length > 0
    - _aur_installed.rc == 0
    - _aur_vercmp.stdout | default('0') | trim | int > 0

- name: Build from the AUR unless the pin is already installed -- {{ aur_package }}
  when:
    - not ansible_check_mode
    - _aur_installed.rc != 0
      or (aur_version | length > 0 and (_aur_vercmp.stdout | default('0') | trim | int) < 0)
      or (aur_version | length == 0 and (_aur_stamp.content | default('') | b64decode | trim) != aur_commit)
  block:
    - name: Resolve the clone directory of {{ aur_package }}
      ansible.builtin.set_fact:
        _aur_dir: '{{ aur_build_home }}/{{ aur_build_user }}/{{ aur_package }}'

    - name: Build tools
      community.general.pacman:
        name: [base-devel, git]
        state: present

    - name: The build users' root, and where the build stamps go
      ansible.builtin.file:
        path: '{{ item }}'
        state: directory
        owner: root
        group: root
        mode: '0755'
      loop:
        - '{{ aur_build_home }}'
        - '{{ aur_build_home }}/stamps'

    - name: A build user that owns the clones and can log in nowhere
      ansible.builtin.user:
        name: '{{ aur_build_user }}'
        system: true
        home: '{{ aur_build_home }}/{{ aur_build_user }}'
        create_home: true
        shell: /usr/bin/nologin
        password: '!'

    # Every git command runs *as* the build user, never as root: git refuses to operate
    # in a repository owned by somebody else ("detected dubious ownership"), and a
    # system-wide `safe.directory` entry is a worse thing to leave behind than a clone
    # nothing but this file touches. `fetch` only when the pinned commit is not already
    # there, so a re-run after a failed build costs nothing.
    - name: Clone at the pinned AUR commit -- {{ aur_package }}
      ansible.builtin.shell: |
        set -euo pipefail
        as_builder() { runuser -u "$BUILD_USER" -- "$@"; }
        if [ -d "$DIR/.git" ]; then
          before="$(as_builder git -C "$DIR" rev-parse HEAD)"
        else
          rm -rf "$DIR"
          install -d -o "$BUILD_USER" -g "$BUILD_USER" -m 0755 "$DIR"
          as_builder git clone -q "https://aur.archlinux.org/${PACKAGE}.git" "$DIR"
          before=none
        fi
        if ! as_builder git -C "$DIR" cat-file -e "${COMMIT}^{commit}" 2> /dev/null; then
          as_builder git -C "$DIR" fetch -q origin
        fi
        as_builder git -C "$DIR" checkout -q --detach "$COMMIT"
        as_builder git -C "$DIR" clean -qxdf
        if [ "$before" = "$(as_builder git -C "$DIR" rev-parse HEAD)" ]; then
          echo unchanged
        else
          echo checked-out
        fi
      args:
        executable: /bin/bash
      environment:
        BUILD_USER: '{{ aur_build_user }}'
        DIR: '{{ _aur_dir }}'
        PACKAGE: '{{ aur_package }}'
        COMMIT: '{{ aur_commit }}'
      register: _aur_clone
      changed_when: _aur_clone.stdout | trim == 'checked-out'

    - name: The pinned recipe's own metadata
      ansible.builtin.slurp:
        src: '{{ _aur_dir }}/.SRCINFO'
      register: _aur_srcinfo

    - name: What it needs, and what it says it produces
      ansible.builtin.set_fact:
        # Version constraints stripped: pacman takes `name>=1.2` on a command line but
        # the module wants plain names, and the constraint is upstream's business.
        # `checkdepends` are left out on purpose -- the build runs with `--nocheck`.
        _aur_deps: >-
          {{ _srcinfo | regex_findall('(?m)^\s*(?:make)?depends(?:_x86_64)? = (.+)$')
             | map('regex_replace', '[<>=].*$', '') | map('trim') | unique | list }}
        _aur_built_version: >-
          {{ (_srcinfo | regex_search('(?m)^\s*pkgver = (.+)$', '\1') | first | trim) ~ '-'
             ~ (_srcinfo | regex_search('(?m)^\s*pkgrel = (.+)$', '\1') | first | trim) }}
      vars:
        _srcinfo: '{{ _aur_srcinfo.content | b64decode }}'

    # The pin's two halves have to agree, or the guard at the top of this file never
    # matches and the package is rebuilt and reinstalled on every converge -- nightly,
    # from the deploy timer, silently.
    - name: The pinned commit builds the declared version
      ansible.builtin.assert:
        that: _aur_built_version == aur_version
        fail_msg: >-
          {{ aur_package }}: the role pins AUR commit {{ aur_commit }}, which builds
          {{ _aur_built_version }}, but declares {{ aur_version }}. Bump the commit and
          the version together.
        quiet: true
      when: aur_version | length > 0

    - name: Install, as root, the build dependencies of {{ aur_package }}
      community.general.pacman:
        name: '{{ _aur_deps }}'
        state: present

    # `--nocheck`: a package's `check()` runs upstream's own test suite (snapraid's is a
    # multi-minute regression run), and re-testing a release on the NAS every time a pin
    # moves is not what this build is for.
    #
    # `pacman -U` is handed the exact files `makepkg --packagelist` names -- the same
    # question makepkg answered when it decided where to write them -- and not a
    # `./*.pkg.tar.*` glob: root would otherwise install whatever is in a directory owned
    # by the build user. `--packagelist` has to run as that user too, because makepkg
    # refuses to run as root at all.
    - name: Run makepkg and install the built package -- {{ aur_package }}
      ansible.builtin.shell: |
        set -euo pipefail
        cd "$DIR"
        rm -f ./*.pkg.tar.*
        runuser -u "$BUILD_USER" -- makepkg --noconfirm --nocheck --clean
        mapfile -t built < <(runuser -u "$BUILD_USER" -- makepkg --packagelist)
        present=()
        for pkg in "${built[@]}"; do
          if [ -f "$pkg" ]; then present+=("$pkg"); fi
        done
        # `--packagelist` names every package the recipe *could* produce, the split
        # `-debug` one included -- and makepkg writes that one only when there were
        # symbols to split out, which an `arch=any` package of shell and python scripts
        # has none of. So what is really there is installed and a missing one is not an
        # error; none at all is.
        #
        # The first element rather than an array length: ansible-lint parses a shell body
        # with the same argument splitter Ansible uses, which reads a dollar-brace-hash as
        # the start of a comment and then calls the line an unbalanced quote.
        [ -n "${present[0]:-}" ] || { echo 'makepkg produced no package at all' >&2; exit 1; }
        pacman -U --noconfirm "${present[@]}"
      args:
        executable: /bin/bash
      environment:
        BUILD_USER: '{{ aur_build_user }}'
        DIR: '{{ _aur_dir }}'
      changed_when: true

    # Written last, after the install succeeded, so a build that failed half way through is
    # retried on the next converge instead of being recorded as done. It is what the guard
    # at the top reads for a `-git` package, whose installed version says nothing about
    # which recipe produced it.
    - name: Record the AUR commit this package was built from -- {{ aur_package }}
      ansible.builtin.copy:
        content: '{{ aur_commit }}'
        dest: '{{ aur_build_home }}/stamps/{{ aur_package }}'
        owner: root
        group: root
        mode: '0644'
