# The render-only path: the same templates, into `<render_output>/storage/`, with nothing
# installed, mounted or asserted. It is what `tests/static/test_storage.py` runs
# `systemd-analyze verify` over.
- name: Render output dir
  ansible.builtin.file:
    path: '{{ render_output }}/storage'
    state: directory
    mode: '0755'

- name: Render the disk and parity mount units
  ansible.builtin.template:
    src: disk.mount.j2
    dest: "{{ render_output }}/storage/{{ item.mount | regex_replace('^/', '') | regex_replace('/', '-') }}.mount"
    mode: '0644'
  loop: '{{ storage_devices }}'
  loop_control:
    label: '{{ item.name }}'

- name: Render the pool mount unit
  ansible.builtin.template:
    src: pool.mount.j2
    dest: '{{ render_output }}/storage/{{ pool_unit }}'
    mode: '0644'

# `msmtprc` renders with `smtp_password` from the role's defaults, which is the literal
# `REPLACE_ME`: this path has no age key and decrypts nothing, and the static test asserts
# the placeholder is what came out -- a real value there would mean the render had read a
# secret.
- name: Render the configuration files
  ansible.builtin.template:
    src: '{{ item.src }}'
    dest: '{{ render_output }}/storage/{{ item.dest }}'
    mode: '0644'
  loop:
    - { src: snapraid.conf.j2, dest: snapraid.conf }
    - { src: msmtprc.j2, dest: msmtprc }
    - { src: maintenance.env.j2, dest: maintenance.env }
    - { src: storage-maintenance.service.j2, dest: storage-maintenance.service }
    - { src: storage-maintenance.timer.j2, dest: storage-maintenance.timer }
  loop_control:
    label: '{{ item.dest }}'
