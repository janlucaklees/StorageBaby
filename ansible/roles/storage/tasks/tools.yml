# mergerfs comes from Chaotic-AUR, a signed binary repository of AUR builds. The whole
# key dance is gated on one cheap check: once `chaotic-keyring` is installed it owns the
# repository's keys, so importing and locally signing the bootstrap key has nothing left
# to do and a second converge reports no change.
#
# `check_mode: false` because this is a read-only query whose result the tasks below read:
# `command` does not support check mode, so under `--check` it would be skipped and its
# registered result would carry no `rc` at all -- and the next `when:` would fail on a
# dict with no such attribute, taking the whole `--check --diff` pre-flight down before it
# ever reaches the mount templates it exists to show. Every registered probe in this role
# carries it for that reason.
- name: Is Chaotic-AUR already set up on this host?
  ansible.builtin.command: pacman -Qq chaotic-keyring chaotic-mirrorlist
  register: _chaotic_pkgs
  changed_when: false
  failed_when: false
  check_mode: false

# Every step that installs something carries `not ansible_check_mode`, spelled out rather
# than left to the modules: under `--check` the repository section below is only *shown* as
# a diff and never written, so a pacman that resolved `mergerfs` against it would fail with
# "target not found" on the very host the pre-flight is meant to describe. A `--check` run
# reports what the role would install; it installs nothing.
- name: Receive and locally sign the Chaotic-AUR signing key
  ansible.builtin.command: '{{ item }}'
  loop:
    - pacman-key --recv-key {{ chaotic_key_id }} --keyserver {{ chaotic_keyserver }}
    - pacman-key --lsign-key {{ chaotic_key_id }}
  when:
    - not ansible_check_mode
    - _chaotic_pkgs.rc != 0
  changed_when: true

# Not `community.general.pacman`: that module installs repository packages by name, and
# these two are the packages that make the repository exist.
#
# Retried, and the only step here that is: the two URLs go straight to
# cdn-mirror.chaotic.cx, with no mirrorlist behind them to fail over to, and it answered
# 503 for four minutes during a run. `until` re-runs the whole `pacman -U`, which is
# right -- either package may be the one that failed, and installing them together is
# what keeps the keyring and the mirrorlist in step. The key import above is a different
# server and keeps its single attempt.
- name: Install the Chaotic-AUR keyring and mirrorlist
  ansible.builtin.command: pacman -U --noconfirm {{ chaotic_packages | join(' ') }}
  when:
    - not ansible_check_mode
    - _chaotic_pkgs.rc != 0
  changed_when: true
  register: _chaotic_fetch
  retries: '{{ chaotic_fetch_attempts }}'
  delay: '{{ chaotic_fetch_delay }}'
  until: _chaotic_fetch.rc == 0

- name: The [chaotic-aur] repository in pacman.conf
  ansible.builtin.blockinfile:
    path: /etc/pacman.conf
    marker: '# {mark} ANSIBLE MANAGED chaotic-aur'
    block: |
      [chaotic-aur]
      Include = /etc/pacman.d/chaotic-mirrorlist
  register: _chaotic_conf

# Only on a change. A `-Sy` on every converge would report changed forever, and this
# runs nightly from the deploy timer.
- name: Refresh the package databases when the repository list changed
  community.general.pacman:
    update_cache: true
  when:
    - not ansible_check_mode
    - _chaotic_conf.changed

# `state: present`, never `latest`: storagebaby already has mergerfs from its own AUR
# build, and a converge is not the place to swap a running union filesystem's binary.
- name: Install mergerfs from Chaotic-AUR
  community.general.pacman:
    name: [mergerfs]
    state: present
  when: not ansible_check_mode

- name: Look for mergerfs's own mount helper
  ansible.builtin.stat:
    path: /usr/bin/mount.mergerfs
  register: _mergerfs_helper

- name: Look for a mount helper under the fuse subtype name
  ansible.builtin.stat:
    path: /usr/bin/mount.fuse.mergerfs
  register: _fuse_helper

# `Type=fuse.mergerfs` in the pool unit makes mount(8) look for a `mount.fuse.mergerfs`
# helper; the package ships the helper as `mount.mergerfs`. mergerfs parses the helper's
# argv and does not care which name it was called under, so one link settles it. Linked
# only when absent, so nothing is ever laid over a path a package owns.
- name: Link mergerfs's mount helper under the fuse subtype name
  ansible.builtin.file:
    src: /usr/bin/mount.mergerfs
    dest: /usr/bin/mount.fuse.mergerfs
    state: link
  when:
    - _mergerfs_helper.stat.exists
    - not _fuse_helper.stat.exists

- name: Build snapraid from the AUR
  ansible.builtin.include_tasks: aur_build.yml
  vars:
    aur_package: snapraid
    aur_commit: '{{ snapraid_aur_commit }}'
    aur_version: '{{ snapraid_version }}'

# Official repositories, so no guard and no `not ansible_check_mode`: a `--check` run
# resolves these against a database it already has and reports what it would install.
# smartmontools is what `snapraid smart` reads the drives through, msmtp is the relay
# client the maintenance mail goes out by, and mutt is what composes it -- the wrapper
# still pipes its report into mutt, as it always did.
#
# rsync is here and not left to the AUR recipe on purpose: `mergerfs-tools-git` declares
# it `optdepends = rsync: for mergerfs.balance and mergerfs.dup`, and an optional
# dependency is never installed. `mergerfs.balance` is precisely what the balance step
# runs, and it needs rsync only when it really has files to move -- so without this the
# nightly run succeeds for as long as the branches happen to be even and fails the first
# night one of them fills up, which is the night it mattered.
- name: Packages the maintenance run needs
  community.general.pacman:
    name: [smartmontools, msmtp, mutt, rsync]
    state: present

# `mergerfs.balance`, which the balance step calls. Not in Chaotic-AUR either, so it is
# built by the same task file -- and it is a `-git` recipe, so the pin is the AUR commit
# and `aur_version` is empty; see `aur_build.yml` for why that changes the guard.
- name: Build mergerfs-tools from the AUR (mergerfs.balance)
  ansible.builtin.include_tasks: aur_build.yml
  vars:
    aur_package: mergerfs-tools-git
    aur_commit: '{{ mergerfs_tools_aur_commit }}'
    aur_version: '{{ mergerfs_tools_version }}'
