# Created when absent and never touched again -- the same rule the `service` role follows
# for a volume directory, and for the same reason with more at stake: on a converged host
# these paths are not empty directories but the roots of mounted filesystems. `/mnt/data/dataN`
# is an ext4 root and `/pool` is the union, where a mode or owner change propagates down
# into every branch root and takes a running service's access away -- nightly, from the
# deploy timer. What the mount point looked like before it carried a filesystem is the
# filesystem's own business.
- name: Look for the mount point directories
  ansible.builtin.stat:
    path: '{{ item.mount }}'
  loop: '{{ storage_devices + [storage.pool] }}'
  loop_control:
    label: '{{ item.mount }}'
  register: _mount_dirs

- name: Mount point directories, created only when absent
  ansible.builtin.file:
    path: '{{ item.item.mount }}'
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop: '{{ _mount_dirs.results }}'
  loop_control:
    label: '{{ item.item.mount }}'
  when: not item.stat.exists

# The precondition the role exists to check. A device that is not there is a disk that
# has been pulled, renamed or has failed to enumerate -- and mounting *nothing* there
# and carrying on is how a pool comes up short a branch and a converge writes service
# data onto the root filesystem.
- name: Look for every declared device
  ansible.builtin.stat:
    path: '{{ item.device }}'
    follow: true
  loop: '{{ storage_devices }}'
  loop_control:
    label: '{{ item.name }} -> {{ item.device }}'
  register: _declared_devices

- name: Every declared device is present
  ansible.builtin.assert:
    that: item.stat.exists
    fail_msg: >-
      Disk {{ item.item.name }} is declared in hosts/{{ inventory_hostname }}/host.yml
      with device {{ item.item.device }}, and nothing is there. Refusing to converge:
      the role does not create, partition or format a disk. Attach it, check
      `lsblk -o NAME,SIZE,PARTUUID,PARTLABEL`, then converge again.
    quiet: true
  loop: '{{ _declared_devices.results }}'
  loop_control:
    label: '{{ item.item.name }}'

- name: Render the disk and parity mount units
  ansible.builtin.template:
    src: disk.mount.j2
    dest: "/etc/systemd/system/{{ item.mount | regex_replace('^/', '') | regex_replace('/', '-') }}.mount"
    owner: root
    group: root
    mode: '0644'
  loop: '{{ storage_devices }}'
  loop_control:
    label: '{{ item.name }}'
  register: disk_units

- name: Render the pool mount unit
  ansible.builtin.template:
    src: pool.mount.j2
    dest: '/etc/systemd/system/{{ pool_unit }}'
    owner: root
    group: root
    mode: '0644'
  register: pool_unit_render

- name: Reload systemd for changed mount units
  ansible.builtin.systemd:
    daemon_reload: true
  when: disk_units.changed or pool_unit_render.changed

# `ansible.builtin.systemd` refuses a unit whose LoadState is `not-found`, and it does so
# in check mode too -- while under `--check` the two templates above wrote nothing. So on a
# host that has never converged there is no unit here to stop, enable or mount, and the
# pre-flight of a first converge would die on the first of them instead of reporting what
# the converge is going to do. Read off the paths and not off the templates' results: in
# check mode a `template` that *would* change a file returns no `dest` at all.
#
# Only a genuinely bare host takes this branch. A real converge has written all five by the
# time it gets here, and the pre-flight this mode exists for -- a pool option about to be
# pushed to a converged host -- finds every one of them, storagebaby's first converge
# included: the units it replaces carry exactly these names.
- name: Look for the mount units on the host
  ansible.builtin.stat:
    path: "/etc/systemd/system/{{ item.mount | regex_replace('^/', '') | regex_replace('/', '-') }}.mount"
  loop: '{{ storage_devices + [storage.pool] }}'
  loop_control:
    label: '{{ item.mount }}'
  register: _mount_unit_files

- name: Whether every mount unit is already on the host
  ansible.builtin.set_fact:
    mount_units_present: "{{ _mount_unit_files.results | rejectattr('stat.exists') | list | length == 0 }}"

- name: What a converge would mount on a host that has none of these units yet
  ansible.builtin.debug:
    msg: >-
      These mount units are not on this host yet, so --check can neither enable nor mount
      them: {{ _absent | join(', ') }}. A real converge writes them, mounts every branch and
      the parity disk, and mounts {{ storage.pool.mount }} over them last.
  vars:
    _absent: "{{ _mount_unit_files.results | rejectattr('stat.exists') | map(attribute='item.mount') | list }}"
  when:
    - ansible_check_mode
    - not (mount_units_present | bool)

# Asked before anything is stopped or restarted, because that is the only moment the
# answer still means "is a bind mount about to be pulled out from under a container".
# `check_mode: false`: a read-only query whose result gates the warning below, and under
# `--check` a skipped command leaves no `stdout` for it to read.
- name: Is the pool mounted right now?
  ansible.builtin.command: systemctl is-active -- {{ pool_unit }}
  register: _pool_active
  changed_when: false
  failed_when: false
  check_mode: false

# Loud, and before anything is remounted rather than after it: remounting the union drops
# every bind mount a running container holds under it, so the services on this host come
# back reading an empty directory until they are restarted. The README says to run the
# playbook with `--check --diff` before pushing a pool option change.
#
# Only when the pool is up: on a first converge every unit is new, nothing is mounted and
# no bind mount can be lost, so the warning would be noise on the one run where the
# operator has nothing to do about it.
- name: Warn that the pool is about to be remounted
  ansible.builtin.debug:
    msg: >-
      {{ pool_unit }} or one of its branches changed and will be remounted. Every
      service with a pool-class volume loses its bind mount across this and has to be
      restarted afterwards -- `make stop SERVICE=<name>` before, `make start
      SERVICE=<name>` after.
  when:
    - disk_units.changed or pool_unit_render.changed
    - _pool_active.stdout | trim == 'active'

# A branch cannot be unmounted while mergerfs holds it open, so a changed disk unit means
# the pool comes down first. A no-op on the first converge, where the pool is not up yet.
- name: Take the pool down before a changed branch is remounted
  ansible.builtin.systemd:
    name: '{{ pool_unit }}'
    state: stopped
  when:
    - disk_units.changed
    - (mount_units_present | bool) or not ansible_check_mode

# One task, not "start" plus "restart the changed ones": on a first converge every unit
# is changed and is not mounted, and `restarted` starts an inactive mount unit -- so the
# two cases collapse into one and nothing is mounted twice.
- name: Disk and parity mounts enabled and mounted
  ansible.builtin.systemd:
    name: "{{ item.item.mount | regex_replace('^/', '') | regex_replace('/', '-') }}.mount"
    enabled: true
    state: "{{ 'restarted' if item.changed else 'started' }}"
  loop: '{{ disk_units.results }}'
  loop_control:
    label: '{{ item.item.name }}'
  when: (mount_units_present | bool) or not ansible_check_mode

- name: The pool enabled and mounted
  ansible.builtin.systemd:
    name: '{{ pool_unit }}'
    enabled: true
    state: "{{ 'restarted' if (disk_units.changed or pool_unit_render.changed) else 'started' }}"
  when: (mount_units_present | bool) or not ansible_check_mode

# `state: started` above already fails when it cannot mount, so this is the second half:
# that what is there is really a mount point and not a directory that happens to exist.
# It is what replaces `host_base`'s `mountpoints` list, and it runs before that role
# creates the storage class roots below the pool.
- name: Check every declared mount
  ansible.builtin.command: mountpoint -q -- {{ item }}
  loop: "{{ (storage_devices | map(attribute='mount') | list) + [storage.pool.mount] }}"
  register: _mounted
  changed_when: false
  failed_when: false
  check_mode: false

- name: Require every declared mount to be mounted
  ansible.builtin.assert:
    that: item.rc == 0
    fail_msg: >-
      {{ item.item }} is declared in hosts/{{ inventory_hostname }}/host.yml under
      `storage` but nothing is mounted there. Refusing to converge: the storage roots
      below it would be created on the root filesystem instead.
    quiet: true
  loop: '{{ _mounted.results }}'
  loop_control:
    label: '{{ item.item }}'
  # Not under `--check`, the one mode where nothing can be mounted and nothing has to be:
  # the mount tasks above were skipped, so what this asserts is the converge's to do, and
  # the storage roots it protects are not going to be created on this run either. The debug
  # below says the same thing in the form a pre-flight can act on. A real converge keeps
  # the assert, which is where it does its work.
  when: not ansible_check_mode

- name: What is not mounted, on a pre-flight that cannot mount it
  ansible.builtin.debug:
    msg: >-
      Nothing is mounted at {{ _unmounted | join(', ') }} right now. A real converge mounts
      each of them before host_base creates the storage roots below
      {{ storage.pool.mount }} -- and refuses rather than creating those roots on the root
      filesystem if it cannot.
  vars:
    _unmounted: "{{ _mounted.results | rejectattr('rc', 'eq', 0) | map(attribute='item') | list }}"
  when:
    - ansible_check_mode
    - _mounted.results | rejectattr('rc', 'eq', 0) | list | length > 0
