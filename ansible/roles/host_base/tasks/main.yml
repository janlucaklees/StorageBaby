- name: Install platform packages
  community.general.pacman:
    name: "{{ ['podman', 'passt', 'sops', 'age', 'ansible', 'git', 'openssh', 'make'] + (packages | default([])) }}"
    state: present

- name: Allow unprivileged binding from port 80 (rootless Traefik on host network)
  ansible.posix.sysctl:
    name: net.ipv4.ip_unprivileged_port_start
    value: '80'
    sysctl_set: true
    state: present
    reload: true

- name: Require the host age key from bootstrap
  ansible.builtin.stat:
    path: /etc/storagebaby/age.key
  register: _age_key
  failed_when: not _age_key.stat.exists

# 0711 keeps /etc/storagebaby unlistable (it holds the age key and the deploy key)
# while still letting a rootless service traverse into the traefik dynamic dir.
# It is set here rather than fixed up afterwards so a second run reports no change.
- name: Platform root, traversable but not listable
  ansible.builtin.file:
    path: /etc/storagebaby
    state: directory
    owner: root
    group: root
    mode: '0711'

- name: Platform directories
  ansible.builtin.file:
    path: '{{ item }}'
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - /etc/storagebaby/traefik
    - /etc/storagebaby/traefik/dynamic.d
    - /etc/containers/systemd/users
    - /var/lib/storagebaby

# Traefik's own default certificate, on a host with no ACME. Without one Traefik
# generates a fresh self-signed certificate every time it starts, which is fine for a
# browser that clicks through the warning and fatal for a Kopia backup client: the
# client pins the fingerprint it saw at connect time, and one Traefik restart locks it
# out. One certificate, made once, is what makes that pin outlive a restart.
#
# `acme: true` hosts get their certificate from Let's Encrypt and none of this runs.
- name: Traefik certificate directory
  ansible.builtin.file:
    path: /etc/storagebaby/traefik/certs
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: not (acme | bool)

- name: Generate Traefik's default certificate once
  ansible.builtin.command:
    argv:
      - openssl
      - req
      - -x509
      - -newkey
      - rsa:4096
      - -nodes
      - -keyout
      - /etc/storagebaby/traefik/certs/default.key
      - -out
      - /etc/storagebaby/traefik/certs/default.crt
      - -days
      - '3650'
      - -subj
      - /CN={{ domain }}
      - -addext
      - subjectAltName=DNS:{{ domain }},DNS:*.{{ domain }}
    creates: /etc/storagebaby/traefik/certs/default.crt
  when: not (acme | bool)

# 0644 on a private key, deliberately. Traefik is rootless: the container's root is
# `svc-traefik` on the host, so the key has to be readable by a non-root user, and the
# alternatives are worse -- chowning it to one service user makes the platform's one
# shared directory that service's, and a group for a single reader is bookkeeping for
# nothing. It is acceptable because this branch only runs on a host with no ACME, which
# is a test VM whose certificate is self-signed, throwaway and worth nothing to anyone.
# A real host takes the `acme: true` path and never has a key here at all.
- name: The default certificate is readable by the rootless Traefik
  ansible.builtin.file:
    path: /etc/storagebaby/traefik/certs/{{ item }}
    owner: root
    group: root
    mode: '0644'
  loop: [default.crt, default.key]
  when: not (acme | bool)

- name: Traefik serves it as the default certificate
  ansible.builtin.copy:
    dest: /etc/storagebaby/traefik/dynamic.d/00-default-certificate.yml
    # The paths are the container's, not the host's: the unit mounts the certs
    # directory at /etc/traefik/certs. `00-` so it is obvious in a directory the
    # service role otherwise fills with one file per route.
    content: |
      tls:
        stores:
          default:
            defaultCertificate:
              certFile: /etc/traefik/certs/default.crt
              keyFile: /etc/traefik/certs/default.key
    owner: root
    group: root
    mode: '0644'
  when: not (acme | bool)

# The other direction: a host that *gains* ACME. Traefik's unit stops mounting the
# certs directory the moment `acme: true` (the template has the `if`), so a surviving
# `00-default-certificate.yml` would point `tls.stores.default` at
# /etc/traefik/certs/default.crt inside a container that no longer has it -- Traefik
# logs the missing file and falls back to a generated certificate, beside a perfectly
# good Let's Encrypt one. The certificate and its key go with it: nothing reads them on
# this host any more, and a private key left lying at 0644 is not a thing to keep.
# This is the same deliberate exception the service role makes for stale route files
# and drop-ins -- a stale *configuration* file is not the inert thing a stale unit is.
- name: No default certificate on a host with ACME
  ansible.builtin.file:
    path: '{{ item }}'
    state: absent
  loop:
    - /etc/storagebaby/traefik/dynamic.d/00-default-certificate.yml
    - /etc/storagebaby/traefik/certs
  when: acme | bool

# Everything below this point writes into the storage roots, and `file: state=directory`
# creates every missing parent on the way -- so on a host whose pool is not mounted it
# would recreate /pool/apps and every volume under it on the root filesystem, empty,
# unattended, from the nightly deploy timer, and the services would come up on the wrong
# data. The mount is a precondition, checked and never created: only the operator knows
# why a declared filesystem is missing.
- name: Check the mountpoints declared in host.yml
  ansible.builtin.command: mountpoint -q -- {{ item }}
  loop: '{{ mountpoints }}'
  register: _mountpoints
  changed_when: false
  failed_when: false
  check_mode: false

- name: Require every declared mountpoint to be mounted
  ansible.builtin.assert:
    that: item.rc == 0
    fail_msg: >-
      {{ item.item }} is declared in hosts/{{ inventory_hostname }}/host.yml under
      `mountpoints` but nothing is mounted there. Refusing to converge: the storage
      roots below it would be created on the root filesystem instead. Mount it, then
      converge again.
    quiet: true
  loop: '{{ _mountpoints.results | default([]) }}'
  loop_control:
    label: '{{ item.item }}'

# A class root is the host's, not the first-converged service's. Without this task
# nobody creates it explicitly and it appears as a by-product of a volume directory:
# `file: state=directory` applies the requested owner and mode to every parent it has
# to create on the way, so `/srv/pool` ended up `0750 svc-<first service>` and every
# other service user was denied the traverse into its own directory below it. Root and
# 0755 here, create-only 0750 svc-owned below -- the split the volume tasks assume.
- name: Storage class roots
  ansible.builtin.file:
    path: '{{ item }}'
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop: "{{ storage_roots | dict2items | map(attribute='value') | list }}"

# A rootless container cannot reach a device through a supplementary group. An image
# that drops privileges internally calls setgroups(), and inside a user namespace
# that can only set gids the namespace maps -- so a host group carried in by
# `GroupAdd=keep-groups`, `render` included, is dropped again and the node stays
# unopenable. (Measured on jellyfin; its README has the evidence.) Mode 0666 on the
# render node is the usual way to hand VAAPI to a rootless container. Only renderD*:
# that is all a transcode needs, and `card*` keeps its group.
- name: Render nodes accessible to rootless containers
  ansible.builtin.copy:
    dest: /etc/udev/rules.d/70-storagebaby-render.rules
    content: |
      KERNEL=="renderD*", SUBSYSTEM=="drm", MODE="0666"
    owner: root
    group: root
    mode: '0644'
  register: _render_rule
  when: gpu | bool

# Only on a change: a reload plus trigger on every converge would report changed
# forever, and this runs nightly from the deploy timer.
- name: Apply the render node rule
  ansible.builtin.shell: udevadm control --reload-rules && udevadm trigger --subsystem-match=drm
  when:
    - gpu | bool
    - _render_rule.changed
  changed_when: true

- name: Deploy units
  ansible.builtin.copy:
    src: '{{ item }}'
    dest: '/etc/systemd/system/{{ item }}'
    mode: '0644'
  loop: [storagebaby-deploy.service, storagebaby-deploy.timer]
  notify: Systemd daemon-reload

- name: Flush handlers
  ansible.builtin.meta: flush_handlers

- name: Deploy timer state
  ansible.builtin.systemd:
    name: storagebaby-deploy.timer
    enabled: '{{ deploy_timer }}'
    state: "{{ 'started' if deploy_timer else 'stopped' }}"
