- name: Derive service facts
  ansible.builtin.set_fact:
    svc_user: 'svc-{{ service.name }}'
    config_dir: '/etc/storagebaby/{{ service.name }}'
    volumes: {}
    routes_out: []

- name: Resolve volume paths
  ansible.builtin.set_fact:
    volumes: >-
      {{ volumes | combine({ item.key:
           (volume_overrides[service.name ~ '/' ~ item.key]
            | default(storage_roots[item.value.class] ~ '/' ~ service.name ~ '/' ~ item.key)) }) }}
  loop: '{{ service.volumes | default({}) | dict2items }}'
  loop_control:
    label: '{{ item.key }}'

# `binds` groups and `groups` are one list to the host: both end up as supplementary
# groups of the service user, and both are why the unit needs GroupAdd=keep-groups.
- name: Derive bind, device and group facts
  ansible.builtin.set_fact:
    binds: '{{ service.binds | default({}) }}'
    devices_enabled: '{{ (gpu | default(false) | bool) and (service.devices | default([]) | length > 0) }}'
    extra_groups: '{{ (_declared + _from_binds) | unique | list }}'
    keep_groups: '{{ (_declared + _from_binds) | length > 0 }}'
  vars:
    _declared: '{{ service.groups | default([]) }}'
    _from_binds: "{{ service.binds | default({}) | dict2items | map(attribute='value.group') | list }}"

# `routes` is the general form, `domain` + `port` the one-route shorthand. Both end up
# as the same list, so every consumer -- the route files, the pod's published ports,
# the templates -- reads one thing. Derived here and not in host.yml: render.yml needs
# it just as much, and both are included below.
- name: Derive hostname, backup flag and raw routes
  ansible.builtin.set_fact:
    hostname: '{{ inventory_hostname }}'
    backup_enabled: "{{ service.backup != 'none' }}"
    _route_specs:
      "{{ service.routes | default(([{'domain': service.domain, 'port': service.port}]
      if service.domain is defined else [])) }}"

# A route's `domain` is either a bare label, which the host's own domain completes, or a
# full hostname, which is used as it stands. The dot is the whole of the rule: a DNS label
# cannot contain one, so the two forms cannot be confused. The second form is how a
# service takes a name under a domain other than the host's default -- the host has to be
# able to certify it (`cert_zones`), and the DNS record is the operator's.
- name: Resolve route fqdns
  ansible.builtin.set_fact:
    routes_out: >-
      {{ routes_out + [item | combine({'fqdn':
         item.domain if '.' in item.domain else item.domain ~ '.' ~ domain})] }}
  loop: '{{ _route_specs }}'
  loop_control:
    label: '{{ item.domain }}'

- name: Routes and the single-route fqdn kept for existing templates
  ansible.builtin.set_fact:
    routes: '{{ routes_out }}'
    fqdn: "{{ (routes_out | first).fqdn if routes_out | length > 0 else '' }}"

# Whether there is a `<name>-tcp.yml` to write, or one to remove. The `{port, target}` and
# `{range: [lo, hi]}` forms are expanded in the template and nowhere else: it is their only
# consumer, and Jinja turns a range into entries far more readably than a chain of
# `set_fact`s would.
- name: Whether this service claims plain TCP ports
  ansible.builtin.set_fact:
    tcp_enabled: '{{ (service.tcp_ports | default([])) | length > 0 }}'

# Which units carry the host-gateway drop-in: the pod when the service has one,
# otherwise every container of the service. Podman refuses `--add-host` on a container
# that joins a pod, so a pod service can only carry it on the pod -- which covers every
# one of its containers, because `test_pod_publishes_exactly_the_route_ports` asserts
# they are all in it, and the generated backup sidecar declares `Pod=` too. Derived
# here rather than in units.yml because render.yml needs the same list.
- name: Units that carry the host-gateway drop-in
  ansible.builtin.set_fact:
    hosts_dropin_units: '{{ _pods if _pods | length > 0 else _containers }}'
  vars:
    _quadlets: "{{ lookup('fileglob', service_dir ~ '/quadlet/*.j2', wantlist=True) | map('basename') | list }}"
    _pods: "{{ _quadlets | select('search', '\\.pod\\.j2$') | map('regex_replace', '\\.j2$', '') | sort | list }}"
    _containers: "{{ _quadlets | select('search', '\\.container\\.j2$') | map('regex_replace', '\\.j2$', '') | sort | list }}"

# Added to `volumes` here, before host.yml creates the volume directories, so the
# sidecar's two get created and owned like any other volume of the service.
- name: Implicit backup volumes
  ansible.builtin.set_fact:
    volumes:
      "{{ volumes | combine({'backup-config': storage_roots.fast ~ '/' ~ service.name ~ '/backup-config',
      'backup-cache': storage_roots.fast ~ '/' ~ service.name ~ '/backup-cache'}) }}"
  when: backup_enabled | bool

# The `exists` test runs on the controller, which is where both candidates live in
# every mode: the checkout for ansible-pull, /repo for a Molecule run.
- name: Resolve the secrets file (host override first)
  ansible.builtin.set_fact:
    secrets_file: >-
      {{ [storagebaby_repo_root ~ '/hosts/' ~ inventory_hostname ~ '/secrets/' ~ service.name ~ '.sops.yaml',
          service_dir ~ '/secrets.sops.yaml']
         | select('exists') | list | first | default('') }}

# `| bool`: ansible-core 2.19 rejects a non-boolean conditional, and `-e render_only=true`
# on the command line arrives as the string 'true'.
- name: Render only
  ansible.builtin.include_tasks: render.yml
  when: render_only | bool

# A `--check --diff` pre-flight of a host that has never converged has no `svc-<name>`
# user yet: the task that creates it is skipped like every other write. Nothing below can
# then be described, let alone attempted -- the uid is the unit directory's own name, the
# image probe and the pull go through `podman-as`, and `systemctl --user -M svc-<name>@`
# has no machine to reach, so `getent` fails, the user-manager wait exhausts its retries
# and the run dies in the middle of the first service. `fail_key: false` asks the question
# instead, and the include below is skipped for that service with a line saying so. A
# pre-flight of a *converged* host -- the run the mode exists for, a pool option or an
# image tag about to be pushed -- finds every user and is unaffected.
- name: Look for the service user (a first converge has none yet)
  ansible.builtin.getent:
    database: passwd
    key: '{{ svc_user }}'
    fail_key: false
  when: not (render_only | bool)

- name: Record whether the service user exists
  ansible.builtin.set_fact:
    svc_user_exists: '{{ getent_passwd[svc_user] is not none }}'
  when: not (render_only | bool)

- name: Converge host
  ansible.builtin.include_tasks: host.yml
  when:
    - not (render_only | bool)
    - (svc_user_exists | default(false) | bool) or not ansible_check_mode

- name: What the first converge will do for this service
  ansible.builtin.debug:
    msg: >-
      {{ svc_user }} does not exist on this host yet, so --check can show nothing of
      {{ service.name }}. The first converge creates that user with its subordinate ids,
      linger and user manager, fetches the images its units name, writes {{ config_dir }},
      its podman secrets and its Quadlet units under
      /etc/containers/systemd/users/<its uid>/, and starts them.
  when:
    - not (render_only | bool)
    - ansible_check_mode
    - not (svc_user_exists | bool)
