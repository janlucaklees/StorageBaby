- name: Derive service facts
  ansible.builtin.set_fact:
    svc_user: 'svc-{{ service.name }}'
    config_dir: '/etc/storagebaby/{{ service.name }}'
    volumes: {}
    routes_out: []

- name: Resolve volume paths
  ansible.builtin.set_fact:
    volumes: >-
      {{ volumes | combine({ item.key:
           (volume_overrides[service.name ~ '/' ~ item.key]
            | default(storage_roots[item.value.class] ~ '/' ~ service.name ~ '/' ~ item.key)) }) }}
  loop: '{{ service.volumes | default({}) | dict2items }}'
  loop_control:
    label: '{{ item.key }}'

# `binds` groups and `groups` are one list to the host: both end up as supplementary
# groups of the service user, and both are why the unit needs GroupAdd=keep-groups.
- name: Derive bind, device and group facts
  ansible.builtin.set_fact:
    binds: '{{ service.binds | default({}) }}'
    devices_enabled: '{{ (gpu | default(false) | bool) and (service.devices | default([]) | length > 0) }}'
    extra_groups: '{{ (_declared + _from_binds) | unique | list }}'
    keep_groups: '{{ (_declared + _from_binds) | length > 0 }}'
  vars:
    _declared: '{{ service.groups | default([]) }}'
    _from_binds: "{{ service.binds | default({}) | dict2items | map(attribute='value.group') | list }}"

# `routes` is the general form, `domain` + `port` the one-route shorthand. Both end up
# as the same list, so every consumer -- the route files, the pod's published ports,
# the templates -- reads one thing. Derived here and not in host.yml: render.yml needs
# it just as much, and both are included below.
- name: Derive hostname, backup flag and raw routes
  ansible.builtin.set_fact:
    hostname: '{{ inventory_hostname }}'
    backup_enabled: "{{ service.backup != 'none' }}"
    _route_specs:
      "{{ service.routes | default(([{'domain': service.domain, 'port': service.port}]
      if service.domain is defined else [])) }}"

- name: Resolve route fqdns
  ansible.builtin.set_fact:
    routes_out: "{{ routes_out + [item | combine({'fqdn': item.domain ~ '.' ~ domain})] }}"
  loop: '{{ _route_specs }}'
  loop_control:
    label: '{{ item.domain }}'

- name: Routes and the single-route fqdn kept for existing templates
  ansible.builtin.set_fact:
    routes: '{{ routes_out }}'
    fqdn: "{{ (routes_out | first).fqdn if routes_out | length > 0 else '' }}"

# Added to `volumes` here, before host.yml creates the volume directories, so the
# sidecar's two get created and owned like any other volume of the service.
- name: Implicit backup volumes
  ansible.builtin.set_fact:
    volumes:
      "{{ volumes | combine({'backup-config': storage_roots.fast ~ '/' ~ service.name ~ '/backup-config',
      'backup-cache': storage_roots.fast ~ '/' ~ service.name ~ '/backup-cache'}) }}"
  when: backup_enabled | bool

# The `exists` test runs on the controller, which is where both candidates live in
# every mode: the checkout for ansible-pull, /repo for a Molecule run.
- name: Resolve the secrets file (host override first)
  ansible.builtin.set_fact:
    secrets_file: >-
      {{ [storagebaby_repo_root ~ '/hosts/' ~ inventory_hostname ~ '/secrets/' ~ service.name ~ '.sops.yaml',
          service_dir ~ '/secrets.sops.yaml']
         | select('exists') | list | first | default('') }}

# `| bool`: ansible-core 2.19 rejects a non-boolean conditional, and `-e render_only=true`
# on the command line arrives as the string 'true'.
- name: Render only
  ansible.builtin.include_tasks: render.yml
  when: render_only | bool

- name: Converge host
  ansible.builtin.include_tasks: host.yml
  when: not (render_only | bool)
