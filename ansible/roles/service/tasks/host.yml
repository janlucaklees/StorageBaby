# The role is included once per placed service in the same play, so a register from
# the previous service is still set when this one is read. Reset both change markers
# up front, otherwise one service's changed secret restarts another service's units.
- name: Reset per-service change markers
  ansible.builtin.set_fact:
    config_copy: { changed: false }
    secret_sync: { changed: false }
    _group_member: { changed: false }

- name: Service user
  ansible.builtin.user:
    name: '{{ svc_user }}'
    system: true
    shell: /usr/bin/nologin
    create_home: true

- name: Look up uid
  ansible.builtin.getent:
    database: passwd
    key: '{{ svc_user }}'

- name: Record uid and unit dir
  ansible.builtin.set_fact:
    svc_uid: '{{ getent_passwd[svc_user][1] }}'
    unit_dir: '/etc/containers/systemd/users/{{ getent_passwd[svc_user][1] }}'

- name: Extra host groups exist
  ansible.builtin.group:
    name: '{{ item }}'
    system: true
  loop: '{{ extra_groups }}'

- name: Service user is a member of its extra groups
  ansible.builtin.user:
    name: '{{ svc_user }}'
    groups: '{{ extra_groups }}'
    append: true
  register: _group_member
  when: extra_groups | length > 0

- name: Check subordinate ids
  ansible.builtin.shell: grep -q '^{{ svc_user }}:' /etc/subuid && grep -q '^{{ svc_user }}:' /etc/subgid
  register: _subids
  changed_when: false
  failed_when: false

- name: Allocate subordinate ids
  ansible.builtin.command: usermod --add-subids {{ svc_user }}
  when: _subids.rc != 0

- name: Enable linger
  ansible.builtin.command: loginctl enable-linger {{ svc_user }}
  args:
    creates: /var/lib/systemd/linger/{{ svc_user }}

# Supplementary groups are read once, when the user's manager starts, so a new
# membership only reaches the containers after that manager is restarted --
# daemon-reexec does not pick it up. A stop/start pair on user@<uid>.service, not
# `loginctl terminate-user`: both halves are synchronous, so the manager is really
# down before it is brought back and the wait below has a bus to talk to. The stop
# takes the service's containers with it; units.yml starts them again at the end of
# this same run. Guarded on the membership change, so a run that changes nothing
# never touches a running service.
- name: Stop the user manager after a membership change
  ansible.builtin.command: systemctl stop user@{{ svc_uid }}.service
  when: _group_member.changed
  changed_when: true

- name: Start the user manager again
  ansible.builtin.command: systemctl start user@{{ svc_uid }}.service
  when: _group_member.changed
  changed_when: true

# rc 1 is what `is-system-running` returns for a degraded manager, which the
# `until` deliberately accepts -- without this the command module would still
# call that attempt a failure.
- name: Wait for the user manager
  ansible.builtin.command: systemctl --user -M {{ svc_user }}@ is-system-running --wait
  register: _mgr
  retries: 15
  delay: 2
  until: _mgr.rc == 0 or 'degraded' in _mgr.stdout
  failed_when: _mgr.rc not in [0, 1]
  changed_when: false

# Create-only, exactly like the bind directories below: the role hands a service a
# volume directory that starts out its own (0750, svc-owned) and then never touches
# its ownership or mode again. An image owns its data tree after first start --
# stirling-pdf, postgres, immich and paperless all chown and chmod their mounts from
# their entrypoints, usually to a non-root uid inside the container, which surfaces on
# the host as a subuid of the service user. Re-permissioning that on every converge
# would not just report changed forever: it takes the running service's access away,
# and with HealthOnFailure=kill that is a restart loop, nightly, from the deploy timer.
- name: Check which volume directories exist
  ansible.builtin.stat:
    path: '{{ item.value }}'
  loop: '{{ volumes | dict2items }}'
  loop_control:
    label: '{{ item.key }} -> {{ item.value }}'
  register: _volume_stat

- name: Create missing volume directories
  ansible.builtin.file:
    path: '{{ item.item.value }}'
    state: directory
    owner: '{{ svc_user }}'
    group: '{{ svc_user }}'
    mode: '0750'
  loop: '{{ _volume_stat.results }}'
  loop_control:
    label: '{{ item.item.key }} -> {{ item.item.value }}'
  when: not item.stat.exists

# Bind paths are host trees the service uses but does not own, so an existing one is
# never re-permissioned: the operator (Phase 4's samba role on storagebaby) decides
# who may read it. The role only guarantees the group exists, that the service user
# is in it, and that a missing path starts out setgid to that group.
- name: Check which bind directories exist
  ansible.builtin.stat:
    path: '{{ item.value.host }}'
  loop: '{{ binds | dict2items }}'
  loop_control:
    label: '{{ item.key }}'
  register: _bind_stat

- name: Create missing bind directories with the declared group
  ansible.builtin.file:
    path: '{{ item.item.value.host }}'
    state: directory
    owner: root
    group: '{{ item.item.value.group }}'
    mode: '2775'
  loop: '{{ _bind_stat.results }}'
  loop_control:
    label: '{{ item.item.key }}'
  when: not item.stat.exists

# root-owned, not svc_user-owned: config is git-driven and deployed by root, the
# service only reads it. It also has to be, for traefik: host_base owns the very
# same path as the root of dynamic.d, and the two would flip ownership every run.
- name: Config directory
  ansible.builtin.file:
    path: '{{ config_dir }}'
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Config files
  ansible.builtin.copy:
    src: '{{ service_dir }}/config/'
    dest: '{{ config_dir }}/'
    owner: '{{ svc_user }}'
    group: '{{ svc_user }}'
    mode: 'u=rwX,go=rX'
  register: config_copy
  when: (service_dir ~ '/config') is directory

- name: Secrets
  ansible.builtin.include_tasks: secrets.yml
  when: service.secrets | length > 0

- name: Units
  ansible.builtin.include_tasks: units.yml
