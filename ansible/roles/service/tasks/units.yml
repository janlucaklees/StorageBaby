# Initialised here rather than reset at the end: the role runs once per placed
# service in the same play, so facts survive into the next service's run.
- name: Start with an empty unit list for this service
  ansible.builtin.set_fact:
    service_units: []
    changed_units: []
    mapped_units: []
    rendered_container_units: []

# --- images, before anything on the host moves --------------------------------------
#
# A first start *is* the pull: podman fetches the image from inside `systemctl start`,
# a container unit inherits the user manager's default `TimeoutStartSec=90s`, and
# podman only holds that window open while the transfer keeps reporting progress. A
# large image over an ordinary link therefore gets its start job killed mid-pull --
# measured on the test host, `immich-server` and `immich-machine-learning` both died at
# 4m15s and `apache/tika` sat on docker.io for 25 minutes with no output at all. Every
# one of them came back seconds later on `Restart=always`, so nothing was broken except
# the converge: "Start units that are not up" had already failed the play, and with it
# every service sorted behind the one that stalled.
#
# Pulling here turns that into ordinary play time and leaves systemd's default start
# timeout meaning what it says -- a service that needs more than 90 s to *start* is
# suspect. No `TimeoutStartSec=` is rendered anywhere for the same reason.
#
# Why the images are read from the templates rather than from the unit files the tasks
# below render: so that a pull that cannot be done leaves the host exactly as it was.
# A rendered-but-never-reloaded unit is worse than no unit at all -- `template` reports
# it unchanged from the next converge on, so the daemon-reload and the restart that
# carry it into the running container never happen again, and the deploy after the
# failed one goes green over a service still running the old image. `lookup('template')`
# renders with the same variables the `template` module would use, on the controller,
# which is where that module renders too.
- name: Render this service's container and build units to see which images they name
  ansible.builtin.set_fact:
    rendered_container_units: "{{ rendered_container_units + [lookup('template', item)] }}"
  loop: "{{ (lookup('fileglob', service_dir ~ '/quadlet/*.j2', wantlist=True)
    | select('search', '\\.(container|build)\\.j2$') | sort | list)
    + (['kopia-client.container.j2'] if backup_enabled | bool else []) }}"
  loop_control:
    label: '{{ item | basename }}'

# An `Image=` does not have to be a registry reference. Quadlet also accepts the name
# of another unit -- `<stem>.build` for an image this host builds (paperless-upload
# does), `<stem>.image` for a `.image` unit -- and a `.build`'s own `ImageTag=` is a
# tag that exists only once that build has run. None of the three can be pulled, and
# none of them needs to be: Quadlet writes a `.build` as `Type=oneshot`, which systemd
# starts with no timeout at all, so whatever its Containerfile pulls cannot hit the
# wall this block exists to avoid. `localhost/` is rejected as well, for a container
# that names a built tag directly instead of the `.build` unit.
- name: The images those units name, minus the ones this host builds itself
  ansible.builtin.set_fact:
    pull_images: >-
      {{ _found | reject('in', _built) | reject('search', '\.(build|image)$')
         | reject('match', 'localhost/') | unique | sort | list }}
  vars:
    _found: "{{ rendered_container_units | map('regex_findall', '(?m)^Image=(.*)$') | flatten | map('trim') | list }}"
    _built: "{{ rendered_container_units | map('regex_findall', '(?m)^ImageTag=(.*)$') | flatten | map('trim') | list }}"

# The probe is what makes this a pull *policy* and not a re-pull: an image already in
# the service user's store is left alone, which is `missing` semantics, and that is
# what keeps this out of `podman-auto-update`'s way. A floating tag
# (`AutoUpdate=registry`, `:latest`) is moved by the service user's own
# `podman-auto-update.timer`, on its schedule and with its own restart; this block only
# guarantees that the reference a unit names exists locally before that unit is
# started. Re-pulling here would fetch a newer digest behind auto-update's back and
# restart the service from a converge that was supposed to change nothing.
#
# It is also how `changed` is decided. `podman pull` prints an image ID whether it
# fetched anything or not, and reading its progress lines would tie the role to wording
# podman is free to change; "it was not there, and now it is" is the same statement,
# made against podman's own image lookup.
- name: Which of those images the service user already has
  ansible.builtin.command: /usr/local/sbin/podman-as {{ svc_user }} podman image exists {{ item }}
  loop: '{{ pull_images }}'
  register: _image_present
  # `check_mode: false`: a read-only probe whose registered result the task below
  # reads, and the one half of this block worth running under `--check` -- it is what
  # lets the pre-flight say which images a push would have to fetch.
  check_mode: false
  changed_when: false
  failed_when: false

# Deliberately *without* `check_mode: false`: a pull writes to the image store, so
# `--check` must not do one. `command` reports itself skipped under check mode, which
# is exactly the behaviour wanted, and nothing below reads this result.
#
# `timeout` the program, not the task's own `timeout:` keyword: ansible-core raises a
# task timeout as a BaseException that bypasses the `until` loop, so a stalled pull
# would fail the converge instead of being retried -- and a stall is the case being
# defended against, the tika pull that produced nothing for 25 minutes and then
# finished in 31 s on the next attempt. `timeout` runs the command in its own process
# group and signals the group, so the `runuser` and the `podman` behind it both go
# down, and rc 124 is a failed attempt like any other for the `until`.
- name: Pull the images the units name, before any unit is reloaded, restarted or started
  ansible.builtin.command: timeout -k 30 600 /usr/local/sbin/podman-as {{ svc_user }} podman pull {{ item.item }}
  loop: '{{ _image_present.results }}'
  loop_control:
    label: '{{ item.item }}'
  when: item.rc != 0
  register: _image_pull
  retries: 3
  delay: 30
  until: _image_pull.rc == 0
  changed_when: true

- name: Unit directory
  ansible.builtin.file:
    path: '{{ unit_dir }}'
    state: directory
    owner: root
    group: root
    mode: '0755'

# `*.timer.j2` and `*.service.j2` are plain systemd user units, not Quadlet ones:
# timers.yml renders those into the service user's own unit directory.
- name: Render quadlet units
  ansible.builtin.template:
    src: '{{ item }}'
    dest: "{{ unit_dir }}/{{ item | basename | regex_replace('\\.j2$', '') }}"
    owner: root
    group: root
    mode: '0644'
  loop: "{{ lookup('fileglob', service_dir ~ '/quadlet/*.j2', wantlist=True)
    | reject('search', '\\.(timer|service)\\.j2$') | list }}"
  loop_control:
    label: '{{ item | basename }}'
  register: quadlet_render

- name: Install the backup client script
  ansible.builtin.copy:
    src: kopia-client.sh
    dest: '{{ config_dir }}/kopia-client.sh'
    owner: '{{ svc_user }}'
    group: '{{ svc_user }}'
    mode: '0644'
  when: backup_enabled | bool
  register: backup_script

# The sidecar is the role's own unit, not the service folder's: a service declaring
# `backup` gets it generated into its pod from the role template.
- name: Render the backup sidecar unit
  ansible.builtin.template:
    src: kopia-client.container.j2
    dest: '{{ unit_dir }}/{{ service.name }}-backup.container'
    owner: root
    group: root
    mode: '0644'
  when: backup_enabled | bool
  register: backup_render

# Quadlet reads `<unit>.d/*.conf` beside a unit file exactly as systemd does, and
# merges them into the unit before generating it -- verified on the podman the test VM
# runs (6.1.2), for `<stem>.pod.d` and `<stem>.container.d` alike. That is what lets
# the role give every service the same `AddHost` block without a line in any service's
# template: the list is the host's placement, not the service's business.
- name: Host-gateway drop-in directories
  ansible.builtin.file:
    path: '{{ unit_dir }}/{{ item }}.d'
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop: '{{ hosts_dropin_units }}'

- name: Render the host-gateway drop-ins
  ansible.builtin.template:
    src: storagebaby-hosts.conf.j2
    dest: '{{ unit_dir }}/{{ item }}.d/10-storagebaby-hosts.conf'
    owner: root
    group: root
    mode: '0644'
  loop: '{{ hosts_dropin_units }}'
  register: hosts_dropin_render

# A stale drop-in is not the harmless thing a stale unit file is. An orphaned unit is
# inert -- it generates a unit nobody starts; an orphaned `<unit>.d/` attaches to a unit
# that still exists and changes what it does. The case is this repo's own migration
# path: a service that gains a `<name>.pod.j2` stops carrying the drop-in on its
# containers, and a `<stem>.container.d/` left behind would make podman refuse to start
# that container ("extra host entries must be specified on the pod") on this converge
# and on every nightly one after it, until someone deleted a file by hand on the host.
# Only the file the role itself writes is looked for, and only its directory removed.
- name: Find every host-gateway drop-in on disk
  ansible.builtin.find:
    paths: '{{ unit_dir }}'
    patterns: 10-storagebaby-hosts.conf
    recurse: true
  register: hosts_dropin_present

- name: Remove the drop-ins of units this service no longer carries
  ansible.builtin.file:
    path: '{{ item.path | dirname }}'
    state: absent
  loop: '{{ hosts_dropin_present.files }}'
  loop_control:
    label: '{{ item.path | dirname | basename }}'
  when: (item.path | dirname | basename | regex_replace('\.d$', '')) not in hosts_dropin_units
  register: hosts_dropin_cleanup

# A changed drop-in is a changed unit. Quadlet generates the unit from the unit file
# and its drop-ins together, so a new `AddHost` set only reaches a running container
# through the same daemon-reload-plus-restart a changed unit file gets. The mapping
# below therefore reads this list beside `item.changed`, keyed by the parent unit's
# file name -- which is exactly what the loop items are.
- name: Note which units have a changed drop-in
  ansible.builtin.set_fact:
    changed_dropin_units: "{{ hosts_dropin_render.results | default([]) | selectattr('changed') | map(attribute='item') | list }}"

# One file and one router per route: two routes of a service would otherwise
# overwrite each other's file.
- name: Render traefik routes
  ansible.builtin.template:
    src: traefik-route.yml.j2
    dest: '/etc/storagebaby/traefik/dynamic.d/{{ service.name }}-{{ route.domain }}.yml'
    owner: root
    group: root
    mode: '0644'
  loop: '{{ routes }}'
  loop_control:
    loop_var: route
    label: '{{ route.domain }}'

- name: Remove the pre-Phase-3 single route file
  ansible.builtin.file:
    path: '/etc/storagebaby/traefik/dynamic.d/{{ service.name }}.yml'
    state: absent

- name: Map rendered files to systemd unit names
  ansible.builtin.set_fact:
    mapped_units: "{{ mapped_units + [{'unit': unit_name, 'kind': _ext,
      'changed': item.changed or (_base in changed_dropin_units)}] }}"
  vars:
    _base: '{{ item.dest | basename }}'
    _stem: '{{ (_base | splitext)[0] }}'
    _ext: '{{ (_base | splitext)[1] }}'
    unit_name: "{{ _stem ~ {'.container': '.service', '.pod': '-pod.service', '.build': '-build.service'}[_ext] }}"
  loop: '{{ quadlet_render.results + ([backup_render] if backup_enabled | bool else []) }}'
  loop_control:
    label: '{{ item.dest | basename }}'
  when: (item.dest | basename | splitext)[1] in ['.container', '.pod', '.build']

# A .build has to run before the pod and the containers that use its image, and a
# rebuilt image only reaches a container when that container is restarted too --
# `restart` on a .build unit re-runs the oneshot build.
- name: Order units build, pod, container and propagate a build change to the containers
  ansible.builtin.set_fact:
    service_units: "{{ ordered | map(attribute='unit') | list }}"
    changed_units: >-
      {{ (ordered | selectattr('changed') | map(attribute='unit') | list)
         + ((ordered | selectattr('kind', 'equalto', '.container') | map(attribute='unit') | list)
            if (ordered | selectattr('kind', 'equalto', '.build') | selectattr('changed') | list | length > 0)
            else []) }}
  vars:
    ordered: >-
      {{ (mapped_units | selectattr('kind', 'equalto', '.build') | list)
         + (mapped_units | selectattr('kind', 'equalto', '.pod') | list)
         + (mapped_units | selectattr('kind', 'equalto', '.container') | list) }}

- name: Restart everything if config or a secret changed
  ansible.builtin.set_fact:
    changed_units: '{{ service_units }}'
  when: config_copy.changed or secret_sync.changed or host_secret_sync.changed or backup_script.changed

# Quadlet binds a pod's containers to its unit, so restarting the pod already stops
# them and brings them back. Restarting each of them again right afterwards kills a
# container seconds into a start it has only just begun -- which on a *first* converge
# is the one start that must not be interrupted, because it is the one that migrates a
# schema or lays down a data directory. Measured, all three on the same run: a
# paperless squashed migration left half-applied ("column 'created' of relation
# 'documents_paperlesstask' does not exist", then a restart loop forever), a
# meilisearch data directory it could no longer read ("failed to infer the version of
# the database"), and a Nextcloud tree rsynced but never installed -- which is worse
# than a crash, because php-fpm serves it and the after-change hooks then run `occ`
# against an instance that answers "Nextcloud is not installed".
#
# So a changed pod is the only restart its containers need. Anything the pod does not
# bring back is started by "Start units that are not up" below, which is one start,
# not a second one on top of a running container.
#
# `reject('in', ...)` rather than `difference()`: ansible-core implements `difference`
# as `set(a) - set(b)`, whose result comes back in arbitrary order, and the order of
# `changed_units` is load-bearing -- the task above it exists to put build before pod
# before container, and a surviving `[pod, build]` would restart the pod's containers
# off the image the rebuild has not produced yet. `reject` keeps the order it is given.
- name: A changed pod is the only restart its containers need
  ansible.builtin.set_fact:
    changed_units: "{{ changed_units | reject('in', _container_units) | list }}"
  vars:
    _pod_units: "{{ mapped_units | selectattr('kind', 'equalto', '.pod') | map(attribute='unit') | list }}"
    _container_units: "{{ mapped_units | selectattr('kind', 'equalto', '.container') | map(attribute='unit') | list }}"
  when: _pod_units | select('in', changed_units) | list | length > 0

- name: Reload the user manager
  ansible.builtin.command: systemctl --user -M {{ svc_user }}@ daemon-reload
  when: quadlet_render.changed or backup_render.changed or hosts_dropin_render.changed or hosts_dropin_cleanup.changed
  changed_when: true

- name: Restart changed units
  ansible.builtin.command: systemctl --user -M {{ svc_user }}@ restart {{ item }}
  loop: '{{ changed_units | unique }}'
  changed_when: true

- name: Check unit states
  ansible.builtin.command: systemctl --user -M {{ svc_user }}@ is-active {{ item }}
  loop: '{{ service_units }}'
  register: _active
  # `check_mode: false`: a read-only probe whose registered result the tasks below read.
  # `command` reports itself skipped under `--check`, and a skipped result carries no
  # `rc` and no `stdout` at all -- so without this the very next `when:` or `set_fact`
  # dies on a dict with no such attribute and takes the whole `--check --diff`
  # pre-flight down. A pre-flight against the live NAS is the operator's only way to see
  # what a push would do, so it has to reach the end of the playbook.
  check_mode: false
  changed_when: false
  failed_when: false

# A Quadlet .build is a Type=oneshot, and this Podman writes it without
# RemainAfterExit -- so a build that has run and succeeded reads `inactive`, not
# `active`. Starting everything that is merely not active would re-run it on every
# converge: reported changed, idempotence broken, and a pointless image rebuild every
# night from the deploy timer. A build unit therefore counts as up once it has run to
# a successful exit; every other kind still has to really be active.
# Result=success on its own is not enough -- it is also what systemd reports for a
# unit that has never run at all, which is exactly the case that must still be
# started. ExecMainStartTimestampMonotonic is 0 until the unit's process has run, so
# the pair means "it ran, and it worked".
- name: Check what the build units last returned
  ansible.builtin.command: systemctl --user -M {{ svc_user }}@ show {{ item }} -p Result -p ExecMainStartTimestampMonotonic
  loop: "{{ service_units | select('search', '-build\\.service$') | list }}"
  register: _build_result
  # `check_mode: false`: read-only, and the task below reads its registered result.
  check_mode: false
  changed_when: false
  failed_when: false

- name: Note which builds have already run and succeeded
  ansible.builtin.set_fact:
    settled_builds: >-
      {{ _build_result.results
         | selectattr('stdout', 'search', '(?m)^Result=success$')
         | rejectattr('stdout', 'search', '(?m)^ExecMainStartTimestampMonotonic=0$')
         | map(attribute='item') | list }}

- name: Start units that are not up
  ansible.builtin.command: systemctl --user -M {{ svc_user }}@ start {{ item.item }}
  loop: '{{ _active.results }}'
  loop_control:
    label: '{{ item.item }}'
  when: item.stdout.strip() != 'active' and item.item not in settled_builds
  changed_when: true

- name: Check auto-update timer
  ansible.builtin.command: systemctl --user -M {{ svc_user }}@ is-enabled podman-auto-update.timer
  register: _au
  # `check_mode: false`: read-only, and the task below reads its registered result.
  check_mode: false
  changed_when: false
  failed_when: false

- name: Enable auto-update timer
  ansible.builtin.command: systemctl --user -M {{ svc_user }}@ enable --now podman-auto-update.timer
  when: _au.stdout.strip() != 'enabled'
  changed_when: true

# Last, and inside units.yml: a hook runs against the containers this file has just
# restarted or started, and it reads `changed_units` to know whether anything moved.
- name: Hooks
  ansible.builtin.include_tasks: hooks.yml
  when: (service.hooks | default({})).get('after_change', []) | length > 0
