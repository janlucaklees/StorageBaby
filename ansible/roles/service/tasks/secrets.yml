# Two kinds of secret land in the same place -- podman secrets of `svc-<name>`, synced
# by the same helper -- but they come from different files. `secrets` are the service's
# own, from its folder (or a host override). `host_secrets` are values shared between
# services of one host, from `hosts/<host>/secrets/<set>.sops.yaml`: that is how a
# kopia client password is the same string for the client and for the server.
- name: Require a secrets file
  ansible.builtin.assert:
    that: secrets_file != ''
    fail_msg: '{{ service.name }} declares secrets but no secrets.sops.yaml was found'
  when: service.secrets | length > 0

- name: Copy the secrets file to the host
  ansible.builtin.copy:
    src: '{{ secrets_file }}'
    dest: '/etc/storagebaby/{{ service.name }}.secrets.sops.yaml'
    owner: root
    group: root
    mode: '0600'
  when: service.secrets | length > 0

- name: Decrypt on the host
  ansible.builtin.command: sops --decrypt --output-type json /etc/storagebaby/{{ service.name }}.secrets.sops.yaml
  environment:
    SOPS_AGE_KEY_FILE: /etc/storagebaby/age.key
  register: _decrypted
  when: service.secrets | length > 0
  changed_when: false
  failed_when: false
  no_log: true

# Reported separately so the reason is visible: the task itself is no_log, which
# would otherwise reduce a failure to "censored". sops writes only diagnostics to
# stderr -- never plaintext -- so stderr is safe to show and stdout is not.
- name: The host could decrypt the secrets file
  ansible.builtin.assert:
    that: _decrypted.rc == 0
    fail_msg: 'sops failed to decrypt {{ service.name }} secrets on the host: {{ _decrypted.stderr }}'
  when: service.secrets | length > 0

- name: Parse
  ansible.builtin.set_fact:
    _secrets: '{{ _decrypted.stdout | from_json }}'
  when: service.secrets | length > 0
  no_log: true

- name: All declared secrets present
  ansible.builtin.assert:
    that: service.secrets | difference(_secrets.keys() | list) | length == 0
    fail_msg: 'missing in secrets file: {{ service.secrets | difference(_secrets.keys() | list) }}'
  when: service.secrets | length > 0

- name: Sync secrets into podman
  ansible.builtin.command:
    cmd: /usr/local/sbin/podman-secret-sync {{ svc_user }} {{ item }}
    stdin: '{{ _secrets[item] }}'
    stdin_add_newline: false
  loop: '{{ service.secrets }}'
  register: secret_sync
  # Not `'CHANGED' in stdout` -- that substring is also in UNCHANGED, which would
  # report a change on every run and break idempotence.
  changed_when: secret_sync.stdout | trim == 'CHANGED'
  no_log: true

- name: Host secret sets referenced by this service
  ansible.builtin.set_fact:
    _sets:
      "{{ service.host_secrets | default({}) | dict2items | map(attribute='value')
      | map('regex_replace', '\\..*$', '') | unique | list }}"

- name: Copy referenced secret sets to the host
  ansible.builtin.copy:
    src: '{{ storagebaby_repo_root }}/hosts/{{ inventory_hostname }}/secrets/{{ item }}.sops.yaml'
    dest: '/etc/storagebaby/set-{{ item }}.secrets.sops.yaml'
    owner: root
    group: root
    mode: '0600'
  loop: '{{ _sets }}'

- name: Decrypt secret sets on the host
  ansible.builtin.command: sops --decrypt --output-type json /etc/storagebaby/set-{{ item }}.secrets.sops.yaml
  environment:
    SOPS_AGE_KEY_FILE: /etc/storagebaby/age.key
  loop: '{{ _sets }}'
  register: _set_decrypted
  changed_when: false
  failed_when: false
  no_log: true

# The results of a decrypt carry the plaintext in `stdout`, and an assert's loop items
# are printed with -v -- so the assert below loops over this projection instead, which
# has the set name, the exit status and sops' diagnostics and nothing else.
- name: Project the set decrypt results without their plaintext
  ansible.builtin.set_fact:
    _set_status: "{{ _set_status + [{'set': item.item, 'rc': item.rc, 'stderr': item.stderr}] }}"
  loop: '{{ _set_decrypted.results }}'
  loop_control:
    label: '{{ item.item }}'
  no_log: true

- name: Secret sets decrypted
  ansible.builtin.assert:
    that: item.rc == 0
    fail_msg: "sops failed to decrypt secret set {{ item['set'] }}: {{ item.stderr }}"
  loop: '{{ _set_status }}'
  loop_control:
    label: "{{ item['set'] }}"

- name: Parse secret sets
  ansible.builtin.set_fact:
    _set_values: '{{ _set_values | combine({item.item: (item.stdout | from_json)}) }}'
  loop: '{{ _set_decrypted.results }}'
  loop_control:
    label: '{{ item.item }}'
  no_log: true

# Without this a missing key is a Jinja undefined error inside a no_log task, which
# reports as "censored" and says nothing at all. Key names are not secret.
- name: Every referenced host secret key exists
  ansible.builtin.assert:
    that: item.value.split('.', 1)[1] in _set_values[item.value.split('.', 1)[0]]
    fail_msg: "secret set {{ item.value.split('.', 1)[0] }} has no key
      {{ item.value.split('.', 1)[1] }} for {{ service.name }}.{{ item.key }}"
  loop: '{{ service.host_secrets | default({}) | dict2items }}'
  loop_control:
    label: '{{ item.key }}'

- name: Sync host secrets into podman
  ansible.builtin.command:
    cmd: /usr/local/sbin/podman-secret-sync {{ svc_user }} {{ item.key }}
    stdin: "{{ _set_values[item.value.split('.', 1)[0]][item.value.split('.', 1)[1]] }}"
    stdin_add_newline: false
  loop: '{{ service.host_secrets | default({}) | dict2items }}'
  loop_control:
    label: '{{ item.key }}'
  register: host_secret_sync
  changed_when: "host_secret_sync.stdout | trim == 'CHANGED'"
  no_log: true
