- name: Render output dirs
  ansible.builtin.file:
    path: '{{ item }}'
    state: directory
    mode: '0755'
  loop:
    - '{{ render_output }}/{{ service.name }}'
    - '{{ render_output }}/{{ service.name }}/timers'
    - '{{ render_output }}/traefik-dynamic.d'

# Same split as units.yml: Quadlet units here, plain systemd user units under timers/.
- name: Render quadlet units
  ansible.builtin.template:
    src: '{{ item }}'
    dest: "{{ render_output }}/{{ service.name }}/{{ item | basename | regex_replace('\\.j2$', '') }}"
    mode: '0644'
  loop: "{{ lookup('fileglob', service_dir ~ '/quadlet/*.j2', wantlist=True)
    | reject('search', '\\.(timer|service)\\.j2$') | list }}"
  loop_control:
    label: '{{ item | basename }}'

- name: Render timer and service units
  ansible.builtin.template:
    src: '{{ item }}'
    dest: "{{ render_output }}/{{ service.name }}/timers/{{ item | basename | regex_replace('\\.j2$', '') }}"
    mode: '0644'
  loop: "{{ lookup('fileglob', service_dir ~ '/quadlet/*.j2', wantlist=True)
    | select('search', '\\.(timer|service)\\.j2$') | list }}"
  loop_control:
    label: '{{ item | basename }}'

- name: Render the backup sidecar unit
  ansible.builtin.template:
    src: kopia-client.container.j2
    dest: '{{ render_output }}/{{ service.name }}/{{ service.name }}-backup.container'
    mode: '0644'
  when: backup_enabled | bool

# Rendered here too, and into the same layout as the host's unit directory, so the
# `quadlet -dryrun` in `tests/static/test_render.py` reads them the way Quadlet on a
# host does. They are directories, which is why the test's file listing still matches.
- name: Host-gateway drop-in directories
  ansible.builtin.file:
    path: '{{ render_output }}/{{ service.name }}/{{ item }}.d'
    state: directory
    mode: '0755'
  loop: '{{ hosts_dropin_units }}'

- name: Render the host-gateway drop-ins
  ansible.builtin.template:
    src: storagebaby-hosts.conf.j2
    dest: '{{ render_output }}/{{ service.name }}/{{ item }}.d/10-storagebaby-hosts.conf'
    mode: '0644'
  loop: '{{ hosts_dropin_units }}'

- name: Render traefik routes
  ansible.builtin.template:
    src: traefik-route.yml.j2
    dest: '{{ render_output }}/traefik-dynamic.d/{{ service.name }}-{{ route.domain }}.yml'
    mode: '0644'
  loop: '{{ routes }}'
  loop_control:
    loop_var: route
    label: '{{ route.domain }}'
