services:
  database:
    image: 'postgres:17-alpine'
    container_name: 'paperless_database'

    restart: 'unless-stopped'
    healthcheck:
      test:
        [
          'CMD',
          'pg_isready',
          '-U',
          '${DATABASE_USER}',
          '-d',
          '${DATABASE_NAME}'
        ]

    environment:
      TZ: '${TZ}'

      POSTGRES_DB: '${DATABASE_NAME}'
      POSTGRES_USER: '${DATABASE_USER}'
      POSTGRES_PASSWORD_FILE: '/run/secrets/paperless_database_password'

    labels:
      com.centurylinklabs.watchtower.enable: true

    secrets:
      - 'paperless_database_password'

    volumes:
      - 'database:/var/lib/postgresql/data'

  broker:
    image: 'redis:alpine'
    container_name: 'paperless_broker'

    restart: 'unless-stopped'
    healthcheck:
      test: ['CMD', 'redis-cli', '--raw', 'incr', 'ping']

    labels:
      com.centurylinklabs.watchtower.enable: true

    environment:
      TZ: '${TZ}'

    volumes:
      - 'broker:/data'

  gotenberg:
    image: 'docker.io/gotenberg/gotenberg:8'
    container_name: 'paperless_gotenberg'

    restart: 'unless-stopped'

    # The gotenberg chromium route is used to convert .eml files. We do not
    # want to allow external content like tracking pixels or even javascript.
    command:
      - 'gotenberg'
      - '--chromium-disable-javascript=true'
      - '--chromium-allow-list=file:///tmp/.*'

    environment:
      TZ: '${TZ}'

  tika:
    image: 'docker.io/apache/tika:latest'
    container_name: 'paperless_tika'

    restart: 'unless-stopped'

    environment:
      TZ: '${TZ}'

  paperless:
    image: 'ghcr.io/paperless-ngx/paperless-ngx:${VERSION}'
    container_name: 'paperless_paperless'

    restart: 'unless-stopped'
    healthcheck:
      test:
        ['CMD', 'curl', '-fs', '-S', '--max-time', '2', 'http://localhost:8000']
      interval: 30s
      timeout: 10s
      retries: 5

    environment:
      PAPERLESS_REDIS: 'redis://broker:6379'

      PAPERLESS_DBHOST: 'database'
      PAPERLESS_DBNAME: '${DATABASE_NAME}'
      PAPERLESS_DBUSER: '${DATABASE_USER}'
      PAPERLESS_DBPASS_FILE: '/run/secrets/paperless_database_password'

      PAPERLESS_TIKA_ENABLED: 1
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT: 'http://gotenberg:3000'
      PAPERLESS_TIKA_ENDPOINT: 'http://tika:9998'

      # The UID and GID of the user used to run paperless in the container. Set this
      # to your UID and GID on the host so that you have write access to the
      # consumption directory.
      USERMAP_GID: '998'

      # The default language to use for OCR. Set this to the language most of your
      # documents are written in.
      PAPERLESS_OCR_LANGUAGE: deu

      # Additional languages to install for text recognition, separated by a
      # whitespace. Note that this is different from PAPERLESS_OCR_LANGUAGE
      # (default=eng), which defines the language used for OCR.
      # The container installs English, German, Italian, Spanish and French by
      # default.
      # See https://packages.debian.org/search?keywords=tesseract-ocr-&searchon=names&suite=buster
      # for available languages.
      # PAPERLESS_OCR_LANGUAGES: jpn jpn-vert

      # This is required if you will be exposing Paperless-ngx on a public domain
      # (if doing so please consider security measures such as reverse proxy)
      PAPERLESS_URL: 'https://${DOMAIN}'
      PAPERLESS_TRUSTED_PROXIES: '${TRAEFIK_CONTAINER_IP}'

      # Adjust this key if you plan to make paperless available publicly. It should
      # be a very long sequence of random characters. You don't need to remember it.
      PAPERLESS_SECRET_KEY_FILE: '/run/secrets/paperless_secret_key'

    labels:
      traefik.enable: true
      traefik.docker.network: 'traefik_network'

      traefik.http.routers.paperless.rule: 'Host(`${DOMAIN}`)'
      traefik.http.routers.paperless.entrypoints: 'websecure'

    secrets:
      - 'paperless_database_password'
      - 'paperless_secret_key'

    volumes:
      - 'data:/usr/src/paperless/data'
      - 'media:/usr/src/paperless/media'
      - './export:/usr/src/paperless/export'
      - './consume:/usr/src/paperless/consume'

    networks:
      - 'default'
      - 'traefik_network'

    depends_on:
      - 'database'
      - 'broker'
      - 'gotenberg'
      - 'tika'

secrets:
  paperless_database_password:
    file: './paperless_database_password.secret'
  paperless_secret_key:
    file: './paperless_secret_key.secret'

volumes:
  data:
  media:
  database:
  broker:

networks:
  traefik_network:
    external: true
