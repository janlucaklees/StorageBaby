name: CI

on:
  push:
    branches: [master, podman-platform]
  pull_request:

# Never two runs of the same ref at once: they would fight over the runner's
# libvirt state. Queue instead of cancelling, so `stable` is not left behind.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make devtools
      - run: make fmt-check
      - run: make test-static

  integration:
    runs-on: ubuntu-latest
    needs: static
    # 90, because 45 was a fit nothing had measured. What is measured is the workstation at
    # the Makefile defaults (12288 MiB / 4 vCPU): 26 minutes for this scenario, 46 for
    # `test-a`. A runner does the same work on 5120 MiB and 2 vCPU, after a second cold
    # `make devtools` that shares no layer cache with the `static` job, and inside it two AUR
    # compiles, the paperless pod's images, a real snapraid sync and scrub over four 4 GB
    # disks and a 120 s poll for the FTP ingest. One harness flake in `create` -- 25 minutes
    # waiting for SSH, recorded once -- would have eaten the old budget on its own. A
    # timed-out job is fail-safe: `promote` is skipped and `stable` does not move, so the cost
    # of this number being too small is a red build and a wrong diagnosis. The next push that
    # runs green here is what measures the real figure; if it swaps instead, the lever is
    # MOLECULE_VM_MEMORY_MIB and not this line.
    timeout-minutes: 90
    # A GitHub-hosted runner has ~7 GB of RAM, less than the 12288 MiB the scenario
    # asks for locally. The scenario reads all three from the environment and falls
    # back to the local sizes and to `test-a` when they are unset.
    env:
      MOLECULE_VM_MEMORY_MIB: '5120'
      MOLECULE_VM_VCPUS: '2'
      # `test-a` places every service and needs a 12 GiB VM; `test-ci` is the subset
      # that still exercises every mechanism once and fits the runner.
      MOLECULE_HOST: test-ci
    steps:
      - uses: actions/checkout@v4
      # Test hosts are KVM VMs driven through the runner's libvirt socket, which
      # the devtools container mounts. GitHub-hosted Ubuntu runners expose /dev/kvm.
      - name: Install libvirt and KVM
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y qemu-kvm libvirt-daemon-system dnsmasq-base
          # The runner also runs Docker, whose nftables rules drop the VM network's
          # traffic unless libvirt uses the iptables backend.
          echo 'firewall_backend = "iptables"' | sudo tee -a /etc/libvirt/network.conf
          sudo systemctl start libvirtd
          for i in $(seq 1 30); do [ -S /var/run/libvirt/libvirt-sock ] && break; sleep 1; done
          sudo virsh net-start default || true
          sudo chmod 666 /dev/kvm
      - run: make devtools
      - run: make test-integration

  promote:
    runs-on: ubuntu-latest
    # Both, spelled out, although `integration` already needs `static`: the transitive gate
    # stops being one the moment anyone gives `integration` an `if: always()` or adds a
    # second job beside it, and what this job must never do is move `stable` past a red run.
    needs: [static, integration]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Hosts track `stable`, so only a commit that passed both jobs can land there.
      - name: Fast-forward stable to the tested commit
        run: git push origin HEAD:refs/heads/stable
