# mise tasks. The Makefile is still the home of the container-driven targets (tests,
# formatting, Molecule); this file starts the move to mise with the targets that run on
# the workstation itself.

[tasks.sops]
description = "Edit an encrypted secret file: mise run sops hosts/<...>/secrets.sops.yaml"
# sops decrypts into a temp file, runs the editor and re-encrypts when it exits. The
# editor is fixed here so a GUI editor that returns immediately (Zed without --wait)
# cannot make sops see "no change" before you typed anything.
env = { EDITOR = "nvim" }
run = '''
set -eu
file="${1:?usage: mise run sops <file>}"
sops "$file" || { rc=$?; [ "$rc" -eq 200 ] && { echo unchanged; exit 0; }; exit "$rc"; }
'''
