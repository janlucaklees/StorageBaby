[pytest]
# `--strict-markers`, and deliberately no `markers =` line beside it: `pytest-order`
# registers `order` itself, so an unknown-mark *error* here means the plugin has gone from
# the devtools image -- and without it the nine `@pytest.mark.order(-1)` marks in
# `test_deploy.py` degrade to a warning and that file runs in alphabetical position, second,
# remounting the pool and pushing a changed traefik port before `test_ftp`, `test_service`,
# `test_storage` and `test_traefik` have run. Registering the marker by hand would hide
# exactly the thing this catches.
addopts = -v --strict-markers
