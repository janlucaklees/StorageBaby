- name: Bootstrap the test host like a real one
  hosts: all
  gather_facts: false
  tasks:
    - name: Wait for cloud-init to finish
      ansible.builtin.command: cloud-init status --wait
      changed_when: false
      failed_when: false

    - name: Copy bootstrap.sh
      ansible.builtin.copy:
        src: /repo/bootstrap.sh
        dest: /usr/local/sbin/storagebaby-bootstrap
        mode: '0755'

    - name: Run bootstrap in local mode
      ansible.builtin.command: /usr/local/sbin/storagebaby-bootstrap --local --repo /srv/storagebaby.git
      changed_when: true

    # bootstrap does a full `pacman -Syu`, and the cached cloud image lags the repositories
    # by however long it has been cached -- so that upgrade regularly replaces the kernel.
    # `/lib/modules` then holds the *new* kernel's modules only, and the kernel that is
    # actually running can no longer load a module it has not already loaded. The symptom
    # is not obviously a kernel problem: every `mount -t overlay` fails with "no such
    # device", podman reports that as "kernel does not support overlay fs: 'overlay' is not
    # supported over btrfs", the converge dies in `service : Sync secrets into podman` on
    # the first service, and a pod's infra container fails with "userxattr: no such
    # device".
    #
    # A real host reboots on its own schedule and its operator deals with this; a VM that
    # is created, bootstrapped and converged in one sequence has to do it here. Compared
    # rather than rebooted unconditionally, so a run against a freshly downloaded image
    # does not pay for a boot it does not need.
    - name: The kernel that is installed, and the one that is running
      ansible.builtin.command: '{{ item }}'
      loop:
        - pacman -Q linux
        - uname -r
      register: _kernels
      changed_when: false

    # `pacman -Q` says "linux 7.2.7.arch1-1" and `uname -r` says "7.2.7-arch1-1": the same
    # version spelled with a different separator, so both are reduced to digits and dots
    # before they are compared.
    - name: Reboot when bootstrap's upgrade stranded the running kernel
      ansible.builtin.reboot:
        reboot_timeout: 600
        msg: storagebaby test harness, kernel upgraded by bootstrap
      vars:
        _installed: "{{ _kernels.results[0].stdout.split()[1] | regex_replace('[^0-9.]', '.') }}"
        _running: "{{ _kernels.results[1].stdout | trim | regex_replace('[^0-9.]', '.') }}"
      when: _installed != _running

    - name: Read the host's age public key
      ansible.builtin.slurp:
        src: /etc/storagebaby/age.pub
      register: _age_pub

    - name: Record it
      ansible.builtin.set_fact:
        storagebaby_age_pub: '{{ (_age_pub.content | b64decode).strip() }}'

    # Stands in for the SMTP relay storagebaby sends its maintenance report through. It
    # writes one file per message, which is what makes "the report arrived and this is what
    # it says" checkable -- a wrong port, a refused auth or a mutt with no sendmail would all
    # otherwise leave the maintenance run itself green and lose the mail.
    #
    # Installed after the reboot above, so it is not killed moments after it starts; enabled
    # all the same, so it also survives one.
    - name: Install the throwaway SMTP sink
      ansible.builtin.copy:
        src: files/test-smtp-sink.py
        dest: /usr/local/sbin/test-smtp-sink
        owner: root
        group: root
        mode: '0755'

    - name: The sink's unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/test-smtp-sink.service
        owner: root
        group: root
        mode: '0644'
        content: |
          [Unit]
          Description=Throwaway SMTP sink for the integration tests

          [Service]
          ExecStart=/usr/local/sbin/test-smtp-sink
          Restart=always

          [Install]
          WantedBy=multi-user.target

    - name: The sink runs
      ansible.builtin.systemd:
        name: test-smtp-sink.service
        daemon_reload: true
        enabled: true
        state: started

# Runs after bootstrap, so pacman's databases are already synced and upgraded -- a
# `-Sy parted` before it would be a partial upgrade -- and before the converge, which is
# the first thing that needs the partitions to exist.
- name: Partition the VM's storage disks the way an operator prepares a new disk
  hosts: all
  gather_facts: false
  vars:
    storagebaby_repo_root: /repo
  tasks:
    - name: Load the host's declaration
      ansible.builtin.include_vars:
        file: '{{ storagebaby_repo_root }}/hosts/{{ inventory_hostname }}/host.yml'

    # Two packages the *harness* needs, neither of which belongs to a role: parted, for
    # the one thing no role in this repo is allowed to do, and attr, for the verifier
    # that reads mergerfs's running configuration off its control file's extended
    # attributes.
    - name: Packages the harness needs and no role may have
      community.general.pacman:
        name: [parted, attr]
        state: present

    - name: Prepare the declared disks
      when: storage is defined
      block:
        - name: The disks this host declares, in order
          ansible.builtin.set_fact:
            _declared: '{{ storage.disks + storage.parity }}'

        - name: One virtual disk per declared disk
          ansible.builtin.assert:
            that: _declared | length == 4
            fail_msg: >-
              {{ inventory_hostname }} declares {{ _declared | length }} disks and
              create.yml attaches 4. Change storage_disk_count in create.yml and
              destroy.yml together.
            quiet: true

        # Identity, not position. `create.yml` gives each virtual disk the serial
        # `storage<n>`, so the guest publishes it as /dev/disk/by-id/virtio-storage<n> and
        # this play names the disk the harness created. Addressing `/dev/vdb`..`/dev/vde`
        # by the index of the entry in host.yml instead put nothing at all between
        # `parted -s ... mklabel gpt` and the root disk except the hope that guest virtio
        # enumeration follows the order the domain XML lists the disks in.
        #
        # The probe reports what the disk is before anything writes to it, and the assert
        # below refuses on anything unexpected -- so the one place in this repository that
        # is allowed to format a device says out loud which device it means.
        - name: Probe each virtual disk before anything writes to it
          ansible.builtin.shell: |
            set -euo pipefail
            dev="/dev/disk/by-id/virtio-storage$((IDX + 1))"
            root_src="$(findmnt -no SOURCE / | sed 's/\[.*\]$//')"
            printf '{"dev":"%s","real":"%s","root":"/dev/%s","pttype":"%s","labelled":%s}\n' \
              "$dev" \
              "$(readlink -f "$dev" 2> /dev/null || true)" \
              "$(lsblk -nso PKNAME "$root_src" | head -n1)" \
              "$(blkid -p -s PTTYPE -o value "$dev" 2> /dev/null || true)" \
              "$([ -e "/dev/disk/by-partlabel/$NAME" ] && echo true || echo false)"
          args:
            executable: /bin/bash
          environment:
            IDX: '{{ idx }}'
            NAME: '{{ item.name }}'
          loop: '{{ _declared }}'
          loop_control:
            index_var: idx
            label: '{{ item.name }}'
          changed_when: false
          register: _disk_probe

        - name: Every disk about to be formatted is one of the harness's own, and empty
          ansible.builtin.assert:
            that:
              - _p.real | length > 0
              - _p.real != _p.root
              - _p.pttype | length == 0
            fail_msg: >-
              Refusing to format {{ _p.dev }} for {{ item.item.name }}: it resolves to
              "{{ _p.real }}", the disk behind / is {{ _p.root }}, and the partition table
              already on it is "{{ _p.pttype }}". A disk this play partitions has to be one
              of the four create.yml attached, and has to carry no partition table yet.
            quiet: true
          vars:
            _p: '{{ item.stdout | from_json }}'
          loop: '{{ _disk_probe.results }}'
          loop_control:
            label: '{{ item.item.name }}'
          # A second `prepare` on a live VM finds the label it wrote the first time, keeps
          # the data and formats nothing -- so the "carries no partition table" half of the
          # assert applies only to a disk that is actually about to be partitioned.
          when: not (item.stdout | from_json).labelled

        # This is the hand step the role refuses to take, done once per VM: a GPT label,
        # one partition spanning the disk, *named* after the declared disk -- which is
        # what makes the `/dev/disk/by-partlabel/<name>` in the tracked host.yml resolve
        # -- and ext4 on it. Guarded on the label already existing so a second `prepare`
        # on a live VM keeps the data, exactly like the secret generation below it.
        - name: Partition, label and format each disk
          ansible.builtin.shell: |
            set -euo pipefail
            dev="/dev/disk/by-id/virtio-storage$((IDX + 1))"
            if [ -e "/dev/disk/by-partlabel/$NAME" ]; then
              echo keeping
              exit 0
            fi
            parted -s "$dev" mklabel gpt mkpart "$NAME" ext4 1MiB 100%
            udevadm settle
            mkfs.ext4 -q -F -L "$NAME" "${dev}-part1"
            udevadm settle
            echo created
          args:
            executable: /bin/bash
          environment:
            IDX: '{{ idx }}'
            NAME: '{{ item.name }}'
          loop: '{{ _declared }}'
          loop_control:
            index_var: idx
            label: '{{ item.name }} -> {{ item.device }}'
          register: _partitioned
          changed_when: _partitioned.stdout == 'created'

- name: Generate throwaway secrets for every placed service, encrypted to the host key
  hosts: all
  gather_facts: false
  vars:
    storagebaby_repo_root: /repo
    _hosts_root: '{{ storagebaby_repo_root }}/hosts'
  tasks:
    - name: Discover shared services (fileglob cannot expand a wildcard directory; use find)
      ansible.builtin.find:
        paths: '{{ _hosts_root }}/shared/services'
        patterns: service.yml
        recurse: true
        depth: 2
        follow: true
      register: _shared
      delegate_to: localhost
      become: false

    - name: Discover this host's services
      ansible.builtin.find:
        paths: '{{ _hosts_root }}/{{ inventory_hostname }}/services'
        patterns: service.yml
        recurse: true
        depth: 2
        follow: true
      register: _own
      delegate_to: localhost
      become: false

    - name: Placed services, shared first
      ansible.builtin.set_fact:
        _placed: "{{ (_shared.files | map(attribute='path') | sort) + (_own.files | map(attribute='path') | sort) }}"
        _refs: []

    - name: Secrets override dir on the controller
      ansible.builtin.file:
        path: '{{ _hosts_root }}/{{ inventory_hostname }}/secrets'
        state: directory
        mode: '0755'
      delegate_to: localhost

    # 32 random bytes as 64 lowercase hex characters, and both properties matter.
    # *Hex*, because an application is allowed to demand a shape: OpenArchiver refuses
    # to start unless STORAGE_ENCRYPTION_KEY and ENCRYPTION_KEY are "a 64-character hex
    # string (32 bytes)", and a base64 value made the whole pod come up and then
    # crash-loop its workers. *64 characters*, because that is the longest anything
    # here asks for. Every other consumer takes an opaque string, so one shape that
    # satisfies the strictest of them satisfies all of them -- this generator knows
    # nothing about which service it is writing for, with two exceptions below.
    # Hex is also URL-safe, which matters where a password is a field inside a
    # connection URL (openarchiver's DATABASE_URL).
    #
    # The first: a backup client's password exists twice, as `kopia_password` in the
    # pod's own secrets and as `client_<pod>` in kopia's, and the two are deliberately
    # not one shared set in the repository (an operator fills both). On a test host they
    # still have to be the *same* random string or no sidecar can log in, so both sides
    # take their value from one plaintext map on the controller, keyed by the pod's
    # name: whichever side is written first generates the value, the other reuses it.
    # The map is thrown away at the start of every prepare and holds nothing but the
    # throwaway values of this run. The second: a `*_htpasswd` secret is a users
    # file Traefik parses, so it gets a known `user:hash` line instead of hex.
    #
    # Kept, not rewritten, when the file already there is encrypted to *this* host's
    # age key. A second `prepare` on a live VM is the operator's iteration loop, and
    # regenerating the values there breaks exactly the services that keep state: kopia
    # restart-loops on "invalid repository password" against the repository the first
    # run created, and a postgres data directory keeps the password it was initialised
    # with. The recipient check is what keeps a *fresh* VM correct — bootstrap makes a
    # new age key, the leftover files from the previous VM are addressed to the old
    # one, and nothing on the new host could decrypt them, so those are rewritten.
    - name: Forget the previous run's kopia client passwords
      ansible.builtin.file:
        path: '/tmp/{{ inventory_hostname }}-kopia-clients.map'
        state: absent
      delegate_to: localhost

    - name: Write and encrypt one secrets file per service
      ansible.builtin.shell: |
        set -euo pipefail
        if [ -f "$OUT" ] && grep -q '{{ storagebaby_age_pub }}' "$OUT"; then
          echo keeping
          exit 0
        fi
        random() { head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n'; }
        # The one value a pod and the kopia server have to agree on, by pod name.
        paired() {
          grep -q "^$1=" "$MAP" 2>/dev/null || printf '%s=%s\n' "$1" "$(random)" >> "$MAP"
          sed -n "s/^$1=//p" "$MAP"
        }
        rm -f "$TMP"
        {% for key in (lookup('file', item) | from_yaml).secrets %}
        {% if key == 'kopia_password' %}
        printf '%s: "%s"\n' '{{ key }}' "$(paired '{{ item | dirname | basename }}')" >> "$TMP"
        {% elif key.startswith('client_') %}
        printf '%s: "%s"\n' '{{ key }}' "$(paired '{{ key[7:] }}')" >> "$TMP"
        {% elif key.endswith('_htpasswd') %}
        # An htpasswd users file, not an opaque value: Traefik's basicAuth parser rejects a
        # line without `user:hash`, the middleware then fails to build and the router it
        # guards answers 404. `test:test`, apr1 -- the tests send the same pair.
        printf '%s: "%s"\n' '{{ key }}' 'test:$apr1$storageb$fLtofQKD3Zr3C1sGTbdBW0' >> "$TMP"
        {% else %}
        printf '%s: "%s"\n' '{{ key }}' "$(random)" >> "$TMP"
        {% endif %}
        {% endfor %}
        sops --encrypt --age {{ storagebaby_age_pub }} --input-type yaml --output-type yaml "$TMP" > "$OUT"
        rm -f "$TMP"
      args:
        executable: /bin/bash
        # sops looks for .sops.yaml from the working directory upwards. From the repo it
        # finds one whose creation rules deliberately do not cover these throwaway test
        # secrets and aborts; from /tmp it finds none and just uses --age.
        chdir: /tmp
      environment:
        TMP: '/tmp/{{ inventory_hostname }}-{{ item | dirname | basename }}-secrets.yaml'
        OUT: '{{ _hosts_root }}/{{ inventory_hostname }}/secrets/{{ item | dirname | basename }}.sops.yaml'
        MAP: '/tmp/{{ inventory_hostname }}-kopia-clients.map'
      loop: '{{ _placed }}'
      loop_control:
        label: '{{ item | dirname | basename }}'
      when: (lookup('file', item) | from_yaml).secrets | length > 0
      delegate_to: localhost
      register: _service_secret
      changed_when: _service_secret.stdout != 'keeping'

    # `host_secrets` are the other half: values shared between services of one host,
    # living in `hosts/<host>/secrets/<set>.sops.yaml` rather than in a service folder.
    # A real host's sets are committed and encrypted to the operator; a test host has
    # to grow its own, and both sides of a shared value have to be the *same* random
    # string -- that is the whole point of a set. So the references are collected
    # first, grouped by set, and one file per set is written with one value per key.
    # No service in the repository declares one at the moment (the kopia client
    # passwords used to, and are paired by name above instead), so on every host the
    # list is empty and the tasks below are no-ops; the mechanism stays supported.
    - name: Collect every host secret reference of every placed service
      ansible.builtin.set_fact:
        _refs: "{{ _refs + ((lookup('file', item) | from_yaml).host_secrets
          | default({}) | dict2items | map(attribute='value') | list) }}"
      loop: '{{ _placed }}'
      loop_control:
        label: '{{ item | dirname | basename }}'

    - name: The set names they reference
      ansible.builtin.set_fact:
        _set_names: "{{ _refs | map('regex_replace', '\\..*$', '') | unique | sort | list }}"

    # On a host where nothing references a set the list is empty and the task is a
    # no-op -- which is what it has to be, rather than writing an empty file or failing
    # on one.
    # Kept on a re-run for the same reason as the per-service files above: a client
    # password that changed under a connected sidecar is state the VM cannot repair.
    - name: Write and encrypt one file per referenced host secret set
      ansible.builtin.shell: |
        set -euo pipefail
        if [ -f "$OUT" ] && grep -q '{{ storagebaby_age_pub }}' "$OUT"; then
          echo keeping
          exit 0
        fi
        rm -f "$TMP"
        {% for key in (_refs | select('match', item ~ '\.') | map('regex_replace', '^[^.]*\.', '') | unique | sort | list) %}
        printf '%s: "%s"\n' '{{ key }}' "$(head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n')" >> "$TMP"
        {% endfor %}
        sops --encrypt --age {{ storagebaby_age_pub }} --input-type yaml --output-type yaml "$TMP" > "$OUT"
        rm -f "$TMP"
      args:
        executable: /bin/bash
        # Same reason as above: from /tmp sops finds no .sops.yaml whose creation rules
        # would override the --age recipient with the operator's production key.
        chdir: /tmp
      environment:
        TMP: '/tmp/{{ inventory_hostname }}-set-{{ item }}.yaml'
        OUT: '{{ _hosts_root }}/{{ inventory_hostname }}/secrets/{{ item }}.sops.yaml'
      loop: '{{ _set_names }}'
      loop_control:
        label: '{{ item }}'
      delegate_to: localhost
      register: _set_secret
      changed_when: _set_secret.stdout != 'keeping'

    # The maintenance mail's relay password. It belongs to no service's `secrets` and to no
    # `host_secrets` set, so neither generator above covers it -- and the storage role
    # refuses to converge without it. Same keep-if-ours rule as the others: a file already
    # encrypted to *this* VM's age key is kept, one left over from a previous VM is rewritten.
    - name: Write and encrypt the mail secret
      ansible.builtin.shell: |
        set -euo pipefail
        if [ -f "$OUT" ] && grep -q '{{ storagebaby_age_pub }}' "$OUT"; then
          echo keeping
          exit 0
        fi
        printf 'smtp_password: "%s"\n' "$(head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n')" > "$TMP"
        sops --encrypt --age {{ storagebaby_age_pub }} --input-type yaml --output-type yaml "$TMP" > "$OUT"
        rm -f "$TMP"
      args:
        executable: /bin/bash
        # Same reason as above: from /tmp sops finds no .sops.yaml whose creation rules would
        # override the --age recipient with the operator's production key.
        chdir: /tmp
      environment:
        TMP: '/tmp/{{ inventory_hostname }}-mail.yaml'
        OUT: '{{ _hosts_root }}/{{ inventory_hostname }}/secrets/mail.sops.yaml'
      delegate_to: localhost
      register: _mail_secret
      changed_when: _mail_secret.stdout != 'keeping'

# Stands in for GitHub: the deploy unit that bootstrap installed already points at
# /srv/storagebaby.git, so seeding a bare repo there is all it takes to make
# `ansible-pull` on the host pull exactly this working tree.
- name: Seed a local git remote from the working tree
  hosts: all
  gather_facts: false
  tasks:
    # The archive has to mirror what a real `stable` checkout holds, not the working
    # tree: the operator's .env and any *.secret file left over from the pre-platform
    # stacks are gitignored, and shipping them to a test VM would put real
    # credentials on a throwaway host. --exclude-vcs-ignores makes GNU tar read every
    # directory's .gitignore, so the archive follows the same rules git does --
    # including for the generated test secrets, which is why they are appended back in
    # a second pass. (`git ls-files` is not an option here: this is a worktree, and
    # git inside the devtools container cannot resolve its .git pointer.)
    - name: Archive the working tree on the controller the way git would see it
      ansible.builtin.shell: |
        set -e
        tar -C /repo --exclude-vcs-ignores \
          --exclude=.git --exclude=.env --exclude='*.secret' \
          --exclude=__pycache__ --exclude=.pytest_cache --exclude=node_modules \
          --exclude=.superpowers --exclude=.claude \
          -cf "$TAR" .
        tar -C /repo -rf "$TAR" hosts/{{ inventory_hostname }}/secrets
        gzip -f "$TAR"
      environment:
        TAR: '/tmp/{{ inventory_hostname }}-src.tar'
      delegate_to: localhost
      changed_when: true

    - name: Create /srv/src
      ansible.builtin.file:
        path: /srv/src
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Copy the archive
      ansible.builtin.copy:
        src: /tmp/{{ inventory_hostname }}-src.tar.gz
        dest: /tmp/src.tgz
        mode: '0644'

    # --no-same-owner: the archive carries the operator's uid from the bind-mounted
    # /repo, and restoring it on /srv/src itself makes git refuse the repo with
    # "detected dubious ownership" -- root would own .git, someone else the worktree.
    - name: Extract
      ansible.builtin.command: tar -C /srv/src --no-same-owner -xzf /tmp/src.tgz
      changed_when: true

    # `add -f` for the secrets: the previous play generated them into the working
    # tree, but .gitignore excludes hosts/test-*/secrets/ so real ones never get
    # committed. Without the force the checkout would fall back to the shared
    # secrets file, which is encrypted to the production key the VM does not have.
    #
    # Runs every time, with no `creates:` guard, and that is the point: the deploy
    # tests commit to this remote and push -- a traefik `port: 8081`, a comment
    # appended to a unit template -- so a guard here would re-extract the working tree
    # and leave the *history* mutated. A second `converge` + `verify` on a surviving VM
    # would then deploy the mutated remote and fail
    # `test_deploy_restores_a_drifted_host_gateway_dropin`, deterministically, because
    # its empty commit drags the 8081 traefik along with it. Committing the re-extracted
    # tree on top and force-pushing `stable` makes `prepare` restore the remote to the
    # working tree instead, so the operator's edit-and-rerun loop is meaningful.
    #
    # `--allow-empty` because the normal case is a tree identical to the last seed;
    # `commit` would otherwise exit 1 and take the play with it.
    - name: Seed the repo and the bare remote from the extracted tree
      ansible.builtin.shell: |
        set -e
        cd /srv/src
        [ -d .git ] || git init -q -b stable
        git -c user.name=t -c user.email=t@t add -A
        if [ -d hosts/{{ inventory_hostname }}/secrets ]; then
          git -c user.name=t -c user.email=t@t add -f hosts/{{ inventory_hostname }}/secrets
        fi
        git -c user.name=t -c user.email=t@t commit -q --allow-empty -m 'seed'
        [ -d /srv/storagebaby.git ] || git clone -q --bare /srv/src /srv/storagebaby.git
        git remote remove origin 2> /dev/null || true
        git remote add origin /srv/storagebaby.git
        git push -qf origin stable
      changed_when: true

# The pre-flight of a host that has never converged, run before the converge that makes it
# one -- the last thing `prepare` does and the only assertion it makes. storagebaby's own
# first converge is exactly this situation: an operator reads `--check --diff` over the
# whole playbook before letting the real run touch the pool, and every role is then looking
# at a host where no service user, no rendered unit and no copied secret exists yet. A
# check-mode run against the *converged* host is what `test_deploy.py` holds; that one
# passed for four tasks while this one could not get past the storage role's mail secrets.
#
# Here and not in `verify`: by then the host is converged and the case is gone.
- name: The whole playbook in check mode, on the host before its first converge
  hosts: all
  become: true
  gather_facts: false
  tasks:
    # `/srv/src` and not `/var/lib/storagebaby/repo`: the checkout `ansible-pull` maintains
    # does not exist until the first deploy. It is the same tree, the same inventory and the
    # same command `test_deploy.py::CHECK` runs, so the two cannot drift.
    - name: Run the playbook with --check --diff from the seeded checkout
      ansible.builtin.command:
        cmd: >-
          timeout 900 ansible-playbook -i ansible/inventory/hosts.yml
          --limit {{ inventory_hostname }} --check --diff ansible/playbook.yml
        chdir: /srv/src
      register: _preflight
      changed_when: false
      failed_when: false

    # rc *and* the recap: a play that fails a host reports it in the recap and exits
    # non-zero, and a `--check` that aborted half way through reports fewer recap lines
    # than it has hosts -- so the presence of a `failed=0` line is part of the claim.
    - name: The pre-flight ended failed=0
      ansible.builtin.assert:
        that:
          - _preflight.rc == 0
          - _recap | length > 0
          - _recap | select('search', 'failed=[1-9]') | list | length == 0
          - _recap | select('search', 'unreachable=[1-9]') | list | length == 0
        fail_msg: >-
          `--check --diff` over the whole playbook does not survive a host that has never
          converged. This is the pre-flight README.md step 9 tells the operator to run
          before the first converge, so it has to reach the end of the play:
