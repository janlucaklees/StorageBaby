# Molecule prints "CRITICAL 'molecule/default/molecule.yml' glob failed" at startup: it looks for a
# `default` scenario to decide on shared state, and this repo only has `test-ci`. The line is harmless.
driver:
  name: default
  options:
    managed: true
platforms:
  - name: test-a
    hostname: test-a
    memory_mib: 8192
    vcpus: 4
    disk: 20G
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: /repo/ansible/roles
  inventory:
    group_vars:
      all:
        ansible_user: root
        ansible_ssh_common_args: -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
  playbooks:
    create: create.yml
    destroy: destroy.yml
    prepare: prepare.yml
    converge: converge.yml
verifier:
  name: testinfra
scenario:
  test_sequence:
    - destroy
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
