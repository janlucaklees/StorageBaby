# Molecule prints "CRITICAL 'molecule/default/molecule.yml' glob failed" at startup: it looks for a
# `default` scenario to decide on shared state, and this repo only has `test-ci`. The line is harmless.
driver:
  name: default
  options:
    managed: true
platforms:
  # The VM's name *is* the host folder under `hosts/`: cloud-init sets the hostname
  # from it, and everything downstream -- which services are placed, which host.yml
  # is loaded, which generated secrets are seeded -- keys off `inventory_hostname`.
  # So `MOLECULE_HOST` selects a placement, not just a machine name: `test-a` (the
  # default) runs everything on the operator's machine, `test-ci` the smaller subset
  # a GitHub runner can carry. One scenario, two hosts, no second copy of the plumbing.
  - name: ${MOLECULE_HOST:-test-a}
    hostname: ${MOLECULE_HOST:-test-a}
    # Overridable so a smaller runner can still run the scenario: CI passes 5120/2,
    # which fits a 7 GB GitHub-hosted runner. Molecule interpolates these from the
    # environment, and the Makefile forwards both into the devtools container.
    memory_mib: ${MOLECULE_VM_MEMORY_MIB:-12288}
    vcpus: ${MOLECULE_VM_VCPUS:-4}
    disk: 20G
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: /repo/ansible/roles
  inventory:
    group_vars:
      all:
        ansible_user: root
        ansible_ssh_common_args: -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
  playbooks:
    create: create.yml
    destroy: destroy.yml
    prepare: prepare.yml
    converge: converge.yml
verifier:
  name: testinfra
scenario:
  test_sequence:
    - destroy
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
